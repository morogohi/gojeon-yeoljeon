부딪치겠다며 맞서고, 몰래 구슬을 조나라로 돌려보냈다`,`구슬은 흠 하나 없이 조나라로 돌아갔다. 완벽귀조(完璧歸趙)다.`),s(`진왕에게 구슬을 다시 바치고 성을 기다렸다`,`그랬다면 구슬만 잃었을 것이다.`),s(`구슬을 들고 다른 나라로 달아났다`,`인상여는 끝까지 사신의 임무를 지켰다.`)]}}],original:{text:`城入趙而璧留秦；城不入，臣請完璧歸趙。`,reading:`성입조이벽류진; 성불입, 신청완벽귀조.`,translation:`성이 조나라에 들어오면 구슬은 진나라에 두겠지만, 성이 들어오지 않으면 신이 구슬을 온전히 하여 조나라로 돌려보내겠습니다.`},related:[{word:`完全`,reading:`완전`,meaning:`모자람이나 흠이 없음`},{word:`完成`,reading:`완성`,meaning:`완전히 다 이룸`},{word:`歸國`,reading:`귀국`,meaning:`자기 나라로 돌아옴`}],modern:`그는 빌린 카메라를 흠집 하나 없이 돌려주었다. 말 그대로 완벽귀조였다.`},{id:`sagi-02`,book:`sagi`,idiom:`刎頸之交`,reading:`문경지교`,meaning:`목이 베여도 후회하지 않을 만큼 생사를 함께하는 깊은 사귐.`,source:`『사기』 염파인상여열전`,heroId:`yeompa`,scenes:[{text:`구슬을 지켜 낸 공으로 인상여는 상경(上卿)에 올라 노장 염파보다 높은 자리에 섰다.`},{text:`염파는 말재주로 자기보다 높아졌다며, 인상여를 만나면 모욕을 주겠다고 별렀다. 인상여는 그를 피했고, 길에서 마주치면 수레를 돌렸다.`},{text:`비겁하다는 부하들에게 인상여는 말했다. 강한 진나라가 조나라를 치지 못하는 것은 두 사람이 있기 때문이며, 두 호랑이가 싸우면 둘 다 살아남지 못한다고.`},{text:`그 말이 염파의 귀에 들어갔다.`,choice:{prompt:`염파는 어떻게 했을까?`,options:[o(`웃통을 벗고 가시나무를 지고 찾아가 사죄했다`,`부형청죄(負荊請罪). 두 사람은 목숨을 함께할 벗이 되었다.`),s(`더 크게 화를 내며 결투를 청했다`,`염파는 나라를 먼저 생각한 인상여의 뜻을 알아들었다.`),s(`벼슬을 버리고 고향으로 떠났다`,`염파는 조정에 남아 인상여와 손을 잡았다.`)]}}],original:{text:`卒相與驩，爲刎頸之交。`,reading:`졸상여환, 위문경지교.`,translation:`마침내 서로 기뻐하며, 목을 베어도 변치 않을 사귐을 맺었다.`},related:[{word:`交友`,reading:`교우`,meaning:`벗을 사귐`},{word:`外交`,reading:`외교`,meaning:`다른 나라와 맺는 관계`},{word:`交換`,reading:`교환`,meaning:`서로 바꿈`}],modern:`창업 초기의 위기를 함께 넘긴 두 공동대표의 사이는 문경지교라 부를 만했다.`},{id:`sagi-03`,book:`sagi`,idiom:`囊中之錐`,reading:`낭중지추`,meaning:`주머니 속 송곳은 끝이 드러나듯, 재능 있는 사람은 저절로 드러남.`,source:`『사기』 평원군우경열전`,heroId:`mosu`,scenes:[{text:`진나라 군대가 조나라 수도 한단을 에워쌌다. 평원군은 초나라에 구원을 청하러 갈 식객 스무 명을 골랐는데, 한 사람이 모자랐다.`},{text:`모수가 스스로 나섰다. 평원군은 현명한 선비는 주머니 속 송곳처럼 끝이 곧 드러나는 법인데, 그대는 3년 동안 이름이 들리지 않았다고 했다.`},{text:`모수는 물러서지 않았다.`,choice:{prompt:`모수의 대답은?`,options:[o(`그래서 오늘 주머니에 넣어 달라는 것입니다. 일찍 넣었다면 자루까지 빠져나왔을 겁니다`,`모수는 초나라 왕 앞에서 칼을 쥐고 담판을 지어 동맹을 끌어냈다. 스스로 나선 일을 모수자천(毛遂自薦)이라 한다.`),s(`그렇다면 물러나겠습니다`,`모수는 기회를 스스로 만들었다.`),s(`다른 식객을 대신 추천하겠습니다`,`모수는 자기 자신을 추천했다.`)]}}],original:{text:`夫賢士之處世也，譬若錐之處囊中，其末立見。`,reading:`부현사지처세야, 비약추지처낭중, 기말입현.`,translation:`무릇 현명한 선비가 세상에 있는 것은 송곳이 주머니 속에 있는 것과 같아서, 그 끝이 곧 드러난다.`},related:[{word:`中心`,reading:`중심`,meaning:`한가운데`},{word:`集中`,reading:`집중`,meaning:`한곳으로 모음`},{word:`中間`,reading:`중간`,meaning:`두 사물의 사이`}],modern:`신입이었지만 낭중지추라, 첫 발표부터 모두의 눈에 띄었다.`},{id:`sagi-04`,book:`sagi`,idiom:`指鹿爲馬`,reading:`지록위마`,meaning:`사슴을 가리켜 말이라 함. 윗사람을 속여 권세를 부리거나, 옳고 그름을 억지로 뒤바꿈.`,source:`『사기』 진시황본기`,heroId:`jogo`,scenes:[{text:`진시황이 죽은 뒤, 환관 조고는 이세 황제를 세우고 권력을 쥐었다.`},{text:`반란을 꾀하던 조고는 신하들이 자기를 따를지 시험하려고, 이세에게 사슴 한 마리를 바치며 말이라고 했다.`},{text:`이세는 웃으며 사슴을 말이라 하느냐고 신하들에게 물었다.`,choice:{prompt:`신하들은 어떻게 답했을까?`,options:[o(`어떤 이는 입을 다물고, 어떤 이는 말이라 하고, 어떤 이는 사슴이라 했다`,`조고는 사슴이라 답한 신하들을 몰래 법으로 해쳤다. 그 뒤로 신하들은 모두 조고를 두려워했다.`),s(`모두 사슴이라고 바로잡았다`,`두려움 때문에 많은 신하가 진실을 말하지 못했다.`),s(`모두 웃으며 넘어갔다`,`이 시험은 웃고 넘길 일이 아니었다.`)]}}],original:{text:`持鹿獻於二世，曰：「馬也。」`,reading:`지록헌어이세, 왈: 「마야.」`,translation:`사슴을 끌고 와 이세에게 바치며 “말입니다.” 하였다.`},related:[{word:`指示`,reading:`지시`,meaning:`가리켜 보임, 일러서 시킴`},{word:`指摘`,reading:`지적`,meaning:`꼭 집어서 가리킴`},{word:`指名`,reading:`지명`,meaning:`여럿 중 누구를 지정함`}],modern:`명백한 수치를 두고도 문제없다고 우기는 보고서는 지록위마라는 비판을 받았다.`},{id:`sagi-05`,book:`sagi`,idiom:`背水之陣`,reading:`배수지진`,meaning:`물을 등지고 친 진. 물러설 곳 없이 목숨을 걸고 맞서는 각오.`,source:`『사기』 회음후열전`,heroId:`hansin`,scenes:[{text:`한나라 장수 한신은 수만의 군사로, 20만이라 일컫는 조나라 군대와 맞서야 했다.`},{text:`한신은 1만 명을 먼저 보내 강을 등지고 진을 치게 했다. 조나라 군사들은 병법도 모른다며 비웃었다.`},{text:`물러설 곳 없는 병사들은 죽기로 싸웠고, 그사이 숨겨 둔 기병이 조나라 성채에 한나라 깃발을 꽂았다. 승리 뒤 장수들이 까닭을 물었다.`,choice:{prompt:`한신이 든 병법은?`,options:[o(`죽을 땅에 빠뜨린 뒤에야 산다`,`陷之死地而後生. 물러설 곳을 없애 병사들의 힘을 끌어낸 것이다.`),s(`산을 오른쪽과 뒤에, 물을 앞과 왼쪽에 두라`,`그것은 장수들이 알던 병법의 상식이었다. 한신은 그 상식을 거꾸로 썼다.`),s(`적을 알고 나를 알면 백 번 싸워도 위태롭지 않다`,`손자병법의 유명한 구절이지만, 이 장면에서 한신이 든 말은 아니다.`)]}}],original:{text:`乃使萬人先行，出，背水陳。`,reading:`내사만인선행, 출, 배수진.`,translation:`이에 1만 명을 먼저 보내 나아가 강을 등지고 진을 치게 하였다. (원문에서는 ‘陣’을 ‘陳’으로 썼다)`},related:[{word:`背景`,reading:`배경`,meaning:`뒤쪽의 경치, 뒤에서 받쳐 주는 힘`},{word:`背信`,reading:`배신`,meaning:`믿음을 저버림`},{word:`水道`,reading:`수도`,meaning:`물이 흐르는 길`}],modern:`마지막 투자 유치를 앞둔 팀은 배수지진의 각오로 출시일을 맞췄다.`},{id:`sagi-06`,book:`sagi`,idiom:`四面楚歌`,reading:`사면초가`,meaning:`사방이 적에게 둘러싸여 도움받을 곳 없는 외로운 처지.`,source:`『사기』 항우본기`,heroId:`hangu`,scenes:[{text:`천하를 다투던 초나라 항우는 해하에서 한나라 군대에 겹겹이 포위되었다. 군사는 줄고 식량도 떨어졌다.`},{text:`밤이 깊자 사방의 한나라 진영에서 초나라 노래가 들려왔다.`},{text:`항우는 크게 놀랐다.`,choice:{prompt:`항우는 무엇이라 생각했을까?`,options:[o(`한나라가 이미 초나라 땅을 모두 차지했단 말인가`,`항우는 “어찌 초나라 사람이 이리도 많은가” 하고 탄식했다.`),s(`우리 원군이 마침내 도착했다`,`노래는 적진에서 들려왔다.`),s(`적이 지쳐 고향을 그리워하고 있다`,`항우가 느낀 것은 희망이 아니라 고립이었다.`)]}}],original:{text:`夜聞漢軍四面皆楚歌，項王乃大驚曰：「漢皆已得楚乎？是何楚人之多也！」`,reading:`야문한군사면개초가, 항왕내대경왈: 「한개이득초호? 시하초인지다야!」`,translation:`밤에 한나라 군대가 사방에서 모두 초나라 노래를 부르는 것을 듣고, 항왕이 크게 놀라 말하였다. “한나라가 이미 초나라를 다 얻었단 말인가? 어찌 이리도 초나라 사람이 많은가!”`},related:[{word:`四方`,reading:`사방`,meaning:`동서남북 네 방위, 여러 곳`},{word:`面談`,reading:`면담`,meaning:`서로 만나서 이야기함`},{word:`歌手`,reading:`가수`,meaning:`노래 부르는 것이 직업인 사람`}],modern:`원자재 값 급등에 수요 감소까지 겹쳐 업계는 사면초가에 빠졌다.`},{id:`sagi-07`,book:`sagi`,idiom:`兔死狗烹`,reading:`토사구팽`,meaning:`토끼를 잡고 나면 사냥개를 삶는다. 쓸모 있을 때 쓰고 필요가 없어지면 버림.`,source:`『사기』 월왕구천세가`,heroId:`beomnyeo`,scenes:[{text:`월왕 구천은 오랜 복수 끝에 오나라를 무너뜨렸다. 그 곁에는 일등 공신 범려와 문종이 있었다.`},{text:`범려는 승리 직후 벼슬을 버리고 떠났다. 그리고 남아 있던 문종에게 편지를 보냈다.`},{text:`편지에는 짧은 경고가 담겨 있었다.`,choice:{prompt:`범려가 쓴 경고는?`,options:[o(`나는 새가 다하면 좋은 활은 감춰지고, 교활한 토끼가 죽으면 사냥개는 삶긴다`,`범려는 구천이 고난은 함께해도 즐거움은 함께할 사람이 아니라고 했다. 떠나지 않은 문종은 결국 자결을 명받았다.`),s(`공을 세웠으니 큰 상을 기다리라`,`범려는 정반대로 내다보았다.`),s(`오나라의 남은 무리를 경계하라`,`범려가 경계한 것은 자기 왕이었다.`)]}}],original:{text:`蜚鳥盡，良弓藏；狡兔死，走狗烹。`,reading:`비조진, 양궁장; 교토사, 주구팽.`,translation:`나는 새가 다 잡히면 좋은 활은 감추어지고, 교활한 토끼가 죽으면 사냥개는 삶아진다.`},related:[{word:`死亡`,reading:`사망`,meaning:`사람이 죽음`},{word:`生死`,reading:`생사`,meaning:`삶과 죽음`},{word:`必死`,reading:`필사`,meaning:`죽을 각오로 힘씀`}],modern:`프로젝트가 끝나자마자 핵심 개발자를 내보낸 회사에 토사구팽이라는 비판이 쏟아졌다.`},{id:`sagi-08`,book:`sagi`,idiom:`管鮑之交`,reading:`관포지교`,meaning:`관중과 포숙아의 사귐. 서로 깊이 이해하고 믿는 변함없는 우정.`,source:`『사기』 관안열전`,heroId:`posuka`,scenes:[{text:`제나라의 관중과 포숙아는 젊어서부터 벗이었다. 함께 장사하면 관중이 이익을 더 가져갔지만, 포숙아는 관중이 가난한 줄 알았기에 탓하지 않았다.`},{text:`관중이 싸움에서 세 번 달아나도, 벼슬에서 세 번 쫓겨나도 포숙아는 그를 겁쟁이나 못난이로 여기지 않았다. 늙은 어머니가 있고, 아직 때를 만나지 못했을 뿐이라 보았다.`},{text:`훗날 관중은 환공의 반대편에 섰다가 붙잡혔다. 포숙아는 환공에게 관중을 재상으로 추천했다.`,choice:{prompt:`관중이 남긴 말은?`,options:[o(`나를 낳은 이는 부모요, 나를 알아준 이는 포숙아다`,`관중은 환공을 도와 제나라를 천하의 패자로 만들었다.`),s(`나는 내 힘만으로 여기까지 왔다`,`관중은 평생 포숙아의 믿음을 잊지 않았다.`),s(`포숙아에게 진 빚은 이제 다 갚았다`,`관중이 남긴 말은 감사였다.`)]}}],original:{text:`生我者父母，知我者鮑子也。`,reading:`생아자부모, 지아자포자야.`,translation:`나를 낳은 이는 부모이지만, 나를 알아준 이는 포숙(鮑子)이다.`},related:[{word:`管理`,reading:`관리`,meaning:`일을 맡아 다스림`},{word:`血管`,reading:`혈관`,meaning:`피가 흐르는 관`},{word:`主管`,reading:`주관`,meaning:`책임지고 맡아 관리함`}],modern:`어려울 때도 서로를 믿어 준 두 사람의 관계는 관포지교에 비할 만했다.`},{id:`nonyu-01`,book:`nonyu`,idiom:`溫故知新`,reading:`온고지신`,meaning:`옛것을 익혀 새것을 앎. 지난 배움을 되새겨 새로운 이치를 깨달음.`,source:`『논어』 위정편`,heroId:`gongja`,scenes:[{text:`노나라의 스승 공자 곁에는 언제나 배우려는 이들이 모였다.`},{text:`공자는 스승이 될 만한 사람의 조건을 한 문장으로 말했다. 많이 아는 것만으로는 부족하다는 뜻이었다.`},{text:`그 한 문장은 오늘날까지 전한다.`,choice:{prompt:`공자의 말은?`,options:[o(`옛것을 익혀 새것을 알면 스승이 될 수 있다`,`배운 것을 되새기는 복습이 곧 새 깨달음의 길이다.`),s(`책을 많이 읽은 사람이 스승이다`,`공자는 양보다 되새김을 강조했다.`),s(`나이가 많은 사람이 스승이다`,`공자는 나이로 스승을 정하지 않았다.`)]}}],original:{text:`子曰：「溫故而知新，可以爲師矣。」`,reading:`자왈: 「온고이지신, 가이위사의.」`,translation:`공자께서 말씀하셨다. “옛것을 익혀 새것을 알면 스승이 될 수 있다.”`},related:[{word:`溫度`,reading:`온도`,meaning:`따뜻하고 찬 정도`},{word:`知識`,reading:`지식`,meaning:`배우거나 겪어서 아는 것`},{word:`新聞`,reading:`신문`,meaning:`새 소식을 전하는 간행물`}],modern:`지난 실패 보고서를 다시 읽으며 새 전략을 세우는 것, 그것이 온고지신이다.`},{id:`nonyu-02`,book:`nonyu`,idiom:`過猶不及`,reading:`과유불급`,meaning:`지나침은 미치지 못함과 같다. 알맞은 정도(중용)가 중요함.`,source:`『논어』 선진편`,heroId:`jagong`,scenes:[{text:`공자의 제자 자공은 말솜씨가 뛰어나고 사람을 견주어 보기를 좋아했다.`},{text:`자공이 자장(師)과 자하(商) 중 누가 더 나은지 물었다. 공자는 자장은 지나치고 자하는 미치지 못한다고 답했다.`},{text:`자공이 다시 물었다. 그렇다면 자장이 더 낫다는 말씀이냐고.`,choice:{prompt:`공자의 대답은?`,options:[o(`지나침은 미치지 못함과 같다`,`넘치는 것도 모자란 것만큼 알맞음에서 벗어난 것이다.`),s(`그렇다, 지나친 쪽이 낫다`,`공자는 어느 한쪽을 낫다고 하지 않았다.`),s(
