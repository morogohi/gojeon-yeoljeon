ons:[s(`조카 항우를 불러 은통을 치고, 스스로 회계의 군사를 일으켰다`,`항량은 남의 장수가 되는 대신 자기가 먼저 움직였다. 정예병 8천을 얻어, 진나라에 맞서는 싸움의 앞줄에 섰다.`),c(`은통의 장수가 되어 명령을 기다렸다`,`항량은 남의 밑에서 기다리지 않았다. 바로 그 ‘먼저’를 자기가 차지했다.`),c(`진나라 조정에 은통을 고발했다`,`항량은 진나라를 무너뜨리려는 쪽이었다.`)]}}],original:{text:`吾聞先即制人，後則爲人所制。`,reading:`오문선즉제인, 후즉위인소제.`,translation:`내가 듣기로, 먼저 하면 남을 누르고 뒤처지면 남에게 눌린다고 했다. (원문에서는 ‘則’ 대신 ‘即’을 썼다)`},related:[{word:`先生`,reading:`선생`,meaning:`먼저 배워 남을 가르치는 사람`},{word:`規則`,reading:`규칙`,meaning:`여럿이 함께 지키기로 한 법칙`},{word:`制度`,reading:`제도`,meaning:`정해 놓은 법과 규칙의 틀`}],modern:`경쟁사보다 한발 앞서 새 서비스를 내놓은 회사가 시장을 차지했다. 선즉제인이었다.`},{id:`mj-02`,book:`myeongjang`,pack:o,idiom:`破釜沈舟`,reading:`파부침주`,meaning:`솥을 깨뜨리고 배를 가라앉힘. 돌아갈 길을 끊고 죽을 각오로 싸움.`,source:`『사기』 항우본기`,heroId:`beomjeung`,era:`진나라 말 · 기원전 207년`,scenes:[{text:`기원전 207년, 진나라 대군이 조나라의 거록성을 에워쌌다. 조나라를 구하러 나선 초나라 군대의 상장군 송의는 안양에 이르러 46일 동안 머물며 나아가지 않았다.`},{text:`버금 장수였던 항우는 머뭇거리는 송의를 처단하고 스스로 군대를 이끌었다. 그리고 군사를 모두 이끌고 강을 건넜다.`},{text:`강을 건넌 뒤, 항우는 군사들 앞에서 명령을 내렸다.`,choice:{prompt:`항우의 명령은?`,options:[s(`배를 모두 가라앉히고, 솥과 시루를 깨뜨리고, 막사를 불태우고, 사흘 치 식량만 지니게 했다`,`돌아갈 마음을 하나도 남기지 않은 초나라 군사는 아홉 번 싸워 진나라 군대를 크게 무찔렀다.`),c(`배를 강가에 매어 두고 물러설 길을 마련했다`,`항우는 정반대로, 물러설 길을 스스로 끊었다.`),c(`진나라에 사신을 보내 화친을 청했다`,`항우는 싸움으로 거록을 구했다.`)]}}],original:{text:`皆沈船，破釜甑，燒廬舍，持三日糧，以示士卒必死，無一還心。`,reading:`개침선, 파부증, 소려사, 지삼일량, 이시사졸필사, 무일환심.`,translation:`배를 모두 가라앉히고 솥과 시루를 깨뜨리고 막사를 불사르고 사흘 치 식량만 지니게 하여, 병사들에게 반드시 죽기로 싸울 것이며 돌아갈 마음은 하나도 없음을 보였다. (성어의 ‘舟’를 원문에서는 ‘船’으로 썼다)`},related:[{word:`破産`,reading:`파산`,meaning:`재산을 모두 잃고 망함`},{word:`沈沒`,reading:`침몰`,meaning:`물속에 가라앉음`},{word:`釜山`,reading:`부산`,meaning:`가마솥(釜)을 닮은 산에서 온 땅 이름`}],modern:`마지막 기회라 여긴 팀은 파부침주의 각오로 결승전에 나섰다.`},{id:`mj-03`,book:`myeongjang`,pack:o,idiom:`鴻門之宴`,reading:`홍문지연`,meaning:`홍문에서 열린 잔치. 겉으로는 환대하지만 속에는 해칠 뜻이 숨은 위험한 자리.`,source:`『사기』 항우본기`,heroId:`beonkwae`,era:`초한전쟁 직전 · 기원전 206년`,scenes:[{text:`기원전 206년, 유방이 항우보다 먼저 진나라 수도 함양에 들어갔다. 뒤따라온 항우는 크게 노해 유방을 치려 했다. 항우의 군사는 40만, 유방은 10만이었다.`},{text:`유방은 홍문에 있는 항우의 진영을 찾아가 사과했고, 항우는 잔치를 열었다. 항우의 책사 범증은 차고 있던 옥 장식을 세 번이나 들어 보이며 유방을 없애라고 신호했지만, 항우는 응하지 않았다.`},{text:`범증은 항우의 사촌 항장에게 칼춤을 추는 척하며 유방을 치라고 시켰다. 그러자 항백이 함께 칼을 뽑아 춤추며 몸으로 유방을 가렸다.`},{text:`다급해진 장량이 밖으로 나가 유방의 장수 번쾌에게 알렸다. “지금 항장이 칼춤을 추는데, 그 뜻은 줄곧 패공에게 있다.”`,choice:{prompt:`번쾌는 어떻게 했을까?`,options:[s(`칼과 방패를 들고 잔치 자리에 뛰어들어 항우를 노려보며 유방을 변호했다`,`항우는 번쾌를 장사라 부르며 술과 고기를 내렸다. 그 틈에 유방은 자리를 빠져나가 살아 돌아갔다.`),c(`밖에서 군사를 이끌고 항우의 진영을 공격했다`,`군사가 훨씬 적은 쪽이 싸웠다면 모두 위험했을 것이다. 번쾌는 혼자 잔치 자리로 들어갔다.`),c(`유방을 두고 혼자 진영으로 돌아갔다`,`번쾌는 끝까지 유방 곁을 지켰다.`)]}}],original:{text:`沛公旦日從百餘騎來見項王，至鴻門。……今者項莊拔劍舞，其意常在沛公也。`,reading:`패공단일종백여기래견항왕, 지홍문. …… 금자항장발검무, 기의상재패공야.`,translation:`패공(유방)은 이튿날 아침 기병 백여 명을 거느리고 항왕을 만나러 와서 홍문에 이르렀다. …… (장량이 번쾌에게) “지금 항장이 칼을 뽑아 춤을 추는데, 그 뜻은 줄곧 패공에게 있다.” (‘홍문지연’은 이 잔치를 가리키는 뒷날의 이름이다)`},related:[{word:`大門`,reading:`대문`,meaning:`큰 문, 집의 정문`},{word:`宴會`,reading:`연회`,meaning:`여럿이 모여 베푸는 잔치`},{word:`專門`,reading:`전문`,meaning:`한 가지 일을 오로지 맡거나 깊이 앎`}],modern:`웃으며 차린 협상 자리가 알고 보니 홍문지연이었다. 그는 끝까지 침착하게 자리를 빠져나왔다.`},{id:`mj-04`,book:`myeongjang`,pack:o,idiom:`國士無雙`,reading:`국사무쌍`,meaning:`나라 안에 둘도 없는 뛰어난 인재.`,source:`『사기』 회음후열전`,heroId:`soha`,era:`초한전쟁 초기 · 기원전 206년`,scenes:[{text:`한신은 처음에 항우 밑에 있었지만 꾀를 내어도 쓰이지 않자, 유방에게로 왔다. 그러나 여기서도 낮은 벼슬에 머물렀다.`},{text:`승상 소하는 한신과 여러 번 이야기를 나누고 그가 남다른 인물임을 알아보았다. 그래도 쓰이지 못하자 한신은 끝내 달아났다. 소하는 왕에게 알릴 틈도 없이 직접 그를 뒤쫓았다.`},{text:`소하마저 달아난 줄 안 유방은 두 팔을 잃은 듯 크게 화를 냈다. 하루 이틀 뒤 돌아온 소하에게 유방이 물었다. 달아난 장수가 열이 넘는데 왜 한신만 쫓았느냐고.`},{text:`소하는 차분히 대답했다.`,choice:{prompt:`소하의 대답은?`,options:[s(`여러 장수는 얻기 쉽지만, 한신 같은 사람은 나라 안에 둘도 없습니다`,`유방은 한신을 대장군으로 삼았다. 한신은 뒷날 배수진 등으로 천하를 평정하는 데 큰 공을 세웠다.`),c(`한신은 제 친척이라 그냥 둘 수 없었습니다`,`소하가 본 것은 집안이 아니라 한신의 재능이었다.`),c(`한신이 군량을 가지고 달아났기 때문입니다`,`소하가 쫓은 까닭은 오직 한신이라는 인재 때문이었다.`)]}}],original:{text:`諸將易得耳。至如信者，國士無雙。`,reading:`제장이득이. 지여신자, 국사무쌍.`,translation:`여러 장수는 얻기 쉬울 뿐입니다. 한신 같은 사람으로 말하면, 나라 안에 둘도 없는 인물입니다.`},related:[{word:`國家`,reading:`국가`,meaning:`나라`},{word:`博士`,reading:`박사`,meaning:`어떤 분야를 깊이 연구해 학위를 받은 사람`},{word:`無限`,reading:`무한`,meaning:`끝이 없음`}],modern:`감독은 그 선수를 우리 팀의 국사무쌍이라 부르며 어떤 조건에도 내주지 않겠다고 했다.`}],u=[{char:`先`,hun:`먼저`,eum:`선`},{char:`則`,hun:`곧`,eum:`즉`},{char:`制`,hun:`절제할`,eum:`제`},{char:`人`,hun:`사람`,eum:`인`},{char:`破`,hun:`깨뜨릴`,eum:`파`},{char:`釜`,hun:`가마`,eum:`부`},{char:`沈`,hun:`잠길`,eum:`침`},{char:`舟`,hun:`배`,eum:`주`},{char:`鴻`,hun:`기러기`,eum:`홍`},{char:`門`,hun:`문`,eum:`문`},{char:`宴`,hun:`잔치`,eum:`연`},{char:`國`,hun:`나라`,eum:`국`},{char:`士`,hun:`선비`,eum:`사`},{char:`無`,hun:`없을`,eum:`무`},{char:`雙`,hun:`두`,eum:`쌍`}],d=[{char:`吾`,hun:`나`,eum:`오`},{char:`聞`,hun:`들을`,eum:`문`},{char:`即`,hun:`곧`,eum:`즉`},{char:`後`,hun:`뒤`,eum:`후`},{char:`所`,hun:`바`,eum:`소`,note:`爲~所~: ‘~에게 ~을 당하다’`},{char:`皆`,hun:`다`,eum:`개`},{char:`船`,hun:`배`,eum:`선`},{char:`甑`,hun:`시루`,eum:`증`},{char:`燒`,hun:`불사를`,eum:`소`},{char:`廬`,hun:`농막집`,eum:`려`,note:`원문에서는 군대의 막사`},{char:`舍`,hun:`집`,eum:`사`},{char:`持`,hun:`가질`,eum:`지`},{char:`三`,hun:`석`,eum:`삼`},{char:`日`,hun:`날`,eum:`일`},{char:`糧`,hun:`양식`,eum:`량`},{char:`以`,hun:`써`,eum:`이`},{char:`示`,hun:`보일`,eum:`시`},{char:`必`,hun:`반드시`,eum:`필`},{char:`一`,hun:`한`,eum:`일`},{char:`還`,hun:`돌아올`,eum:`환`},{char:`心`,hun:`마음`,eum:`심`},{char:`者`,hun:`놈`,eum:`자`,note:`今者: ‘지금’`},{char:`項`,hun:`항목`,eum:`항`,note:`성씨 항(項羽·項莊)`},{char:`莊`,hun:`씩씩할`,eum:`장`,note:`사람 이름(項莊)`},{char:`拔`,hun:`뽑을`,eum:`발`},{char:`劍`,hun:`칼`,eum:`검`},{char:`舞`,hun:`춤출`,eum:`무`},{char:`其`,hun:`그`,eum:`기`},{char:`意`,hun:`뜻`,eum:`의`},{char:`常`,hun:`떳떳할`,eum:`상`,note:`원문에서는 ‘줄곧, 늘’`},{char:`在`,hun:`있을`,eum:`재`},{char:`沛`,hun:`늪`,eum:`패`,note:`沛公: 패 땅에서 일어난 유방의 호칭`},{char:`公`,hun:`공평할`,eum:`공`,note:`높여 부르는 말(공)`},{char:`也`,hun:`어조사`,eum:`야`},{char:`旦`,hun:`아침`,eum:`단`,note:`旦日: 이튿날 아침`},{char:`從`,hun:`좇을`,eum:`종`,note:`원문에서는 ‘거느리다’`},{char:`百`,hun:`일백`,eum:`백`},{char:`餘`,hun:`남을`,eum:`여`},{char:`騎`,hun:`말탈`,eum:`기`,note:`원문에서는 ‘기병’`},{char:`見`,hun:`볼`,eum:`견`,note:`뵐 현`},{char:`王`,hun:`임금`,eum:`왕`},{char:`諸`,hun:`모두`,eum:`제`},{char:`將`,hun:`장수`,eum:`장`},{char:`易`,hun:`쉬울`,eum:`이`,note:`바꿀 역`},{char:`得`,hun:`얻을`,eum:`득`},{char:`耳`,hun:`귀`,eum:`이`,note:`문장 끝에서는 ‘~일  손을 잡았다. 소진은 여섯 나라 재상의 도장을 함께 차게 되었다.`),_(`진나라의 꼬리라도 되는 것이 안전하다며 거절했다`,`한왕은 ‘소의 꼬리’라는 말에 자존심이 상해 오히려 마음을 굳혔다.`),_(`소진을 붙잡아 진나라에 넘겼다`,`한왕은 소진의 말을 받아들였다.`)]}}],original:{text:`臣聞鄙諺曰：「寧爲雞口，無爲牛後。」`,reading:`신문비언왈: 「영위계구, 무위우후.」`,translation:`신이 듣기로 시골 속담에 “차라리 닭의 부리가 될지언정 소의 꼬리는 되지 마라.” 하였습니다. (원문은 ‘鷄’를 ‘雞’로 썼다)`},related:[{word:`鷄卵`,reading:`계란`,meaning:`닭의 알`},{word:`入口`,reading:`입구`,meaning:`들어가는 문이나 길`},{word:`韓牛`,reading:`한우`,meaning:`우리나라 소`}],modern:`큰 회사의 말단보다 작은 회사의 책임자를 택한 그는 계구우후를 떠올렸다.`},{id:`cs-02`,book:`chaeksa`,pack:h,idiom:`先從隗始`,reading:`선종외시`,meaning:`먼저 곽외부터 시작하라. 큰일을 하려면 가까운 일, 자기 자신부터 시작함.`,source:`『사기』 연소공세가`,heroId:`gwakoe`,era:`전국시대 · 기원전 311년 무렵`,scenes:[{text:`제나라에 크게 패한 연나라에서 소왕이 새 왕이 되었다. 소왕은 몸을 낮추고 넉넉한 예물을 내어 어진 사람들을 불러 모으려 했다.`},{text:`소왕은 곽외에게 물었다. 제나라에 당한 치욕을 씻고 싶으니 함께 나라를 일으킬 인재를 어떻게 얻을 수 있겠느냐고.`},{text:`곽외가 대답했다.`,choice:{prompt:`곽외의 대답은?`,options:[g(`인재를 부르고 싶다면 먼저 저 곽외부터 쓰십시오. 저보다 어진 사람들이 어찌 천 리를 멀다 하겠습니까`,`소왕은 곽외를 위해 집을 고쳐 지어 스승으로 모셨다. 그러자 악의·추연·극신 같은 인재들이 앞다투어 연나라로 왔다.`),_(`먼 나라의 이름난 선비부터 비싼 값에 모셔 오십시오`,`곽외는 멀리서 찾기 전에 가까운 곳에서부터 시작하라고 했다.`),_(`인재는 저절로 찾아오니 기다리십시오`,`곽외는 왕이 먼저 본을 보이라고 했다.`)]}}],original:{text:`王必欲致士，先從隗始。況賢於隗者，豈遠千里哉！`,reading:`왕필욕치사, 선종외시. 황현어외자, 기원천리재!`,translation:`왕께서 꼭 선비를 부르고자 하신다면 먼저 저 곽외부터 시작하십시오. 하물며 저보다 어진 사람들이 어찌 천 리를 멀다 하겠습니까!`},related:[{word:`從事`,reading:`종사`,meaning:`어떤 일을 맡아서 함`},{word:`始作`,reading:`시작`,meaning:`처음으로 함`},{word:`開始`,reading:`개시`,meaning:`일을 열어 시작함`}],modern:`학급 분리수거를 바꾸자던 반장은 선종외시라며 자기 자리부터 정리하기 시작했다.`},{id:`cs-03`,book:`chaeksa`,pack:h,idiom:`鷄鳴狗盜`,reading:`계명구도`,meaning:`닭 울음 흉내와 개 흉내 내는 좀도둑. 하찮아 보이는 재주도 쓰일 때가 있음. (낮잡아 보는 뜻으로도 씀)`,source:`『사기』 맹상군열전`,heroId:`maengsang`,era:`전국시대 · 기원전 299년 무렵`,scenes:[{text:`제나라의 맹상군은 재주 있는 사람이라면 신분을 가리지 않고 식객으로 받아들였다. 그 수가 수천 명에 이르렀다.`},{text:`진나라 소왕이 맹상군을 불러들였다가 해치려 했다. 맹상군은 왕이 아끼는 여인에게 도움을 청했는데, 그는 하얀 여우 털옷을 바라였다. 그 옷은 이미 왕에게 바친 뒤였다.`},{text:`그때 가장 낮은 자리의 식객이 나섰다. 개처럼 몰래 들어가 훔치는 재주를 가진 그는 밤에 왕의 창고에서 여우 털옷을 가져왔고, 덕분에 맹상군은 풀려났다.`},{text:`맹상군 일행은 밤중에 국경의 함곡관에 이르렀다. 관문은 닭이 울어야 열리는데 뒤에서는 진나라 군사가 쫓아오고 있었다.`,choice:{prompt:`맹상군 일행은 어떻게 빠져나갔을까?`,options:[g(`닭 울음 흉내를 잘 내는 식객이 울자, 주변 닭들이 따라 울어 관문이 열렸다`,`평소 이 두 식객을 함께 대접하는 것을 부끄러워하던 사람들도 그제야 모두 탄복했다.`),_(`문지기에게 큰돈을 주고 문을 열게 했다`,`맹상군을 살린 것은 돈이 아니라 하찮아 보이던 재주였다.`),_(`날이 밝을 때까지 관문 앞에서 기다렸다`,`기다렸다면 쫓아온 진나라 군사에게 잡혔을 것이다.`)]}}],original:{text:`最下坐有能爲狗盜者……客之居下坐者有能爲雞鳴，而雞齊鳴，遂發傳出。`,reading:`최하좌유능위구도자…… 객지거하좌자유능위계명, 이계제명, 수발전출.`,translation:`가장 낮은 자리에 개처럼 훔치는 재주를 가진 이가 있었다. …… 식객 가운데 아랫자리에 앉은 이가 닭 울음소리를 잘 냈는데, 그러자 닭들이 일제히 울어 마침내 통행증을 내보이고 관문을 나갔다. (원문은 ‘鷄’를 ‘雞’로 썼다)`},related:[{word:`共鳴`,reading:`공명`,meaning:`남의 생각에 같은 마음이 됨`},{word:`强盜`,reading:`강도`,meaning:`힘으로 남의 것을 빼앗는 도둑`},{word:`鷄卵`,reading:`계란`,meaning:`닭의 알`}],modern:`모두 쓸모없다던 친구의 성대모사 실력이 장기자랑에서 반을 우승으로 이끌었다. 계명구도가 따로 없었다.`},{id:`cs-04`,book:`chaeksa`,pack:h,idiom:`奇貨可居`,reading:`기화가거`,meaning:`진귀한 물건은 사 둘 만하다. 좋은 기회를 놓치지 않고 잡아 두면 큰 이익이 됨.`,source:`『사기』 여불위열전`,heroId:`yeobulwi`,era:`전국시대 말 · 기원전 3세기 중엽`,scenes:[{text:`여불위는 여러 나라를 오가며 싸게 사서 비싸게 팔아 큰돈을 모은 상인이었다.`},{text:`조나라 수도 한단에는 진나라 왕손 자초가 볼모로 와 있었다. 자초는 형제가 스무 명이 넘는 서자였고, 진나라가 조나라를 자주 쳤기 때문에 조나라에서 푸대접을 받으며 어렵게 살았다.`},{text:`장사하러 한단에 온 여불위가 자초를 보았다.`,choice:{prompt:`여불위는 어떻게 했을까?`,options:[g(`이 사람은 사 둘 만한 진귀한 물건이라며, 재산을 들여 자초를 진나라 태자의 후계자로 세웠다`,`여불위는 자식이 없던 태자비 화양부인을 설득해 자초를 아들로 삼게 했다. 자초는 뒷날 진나라 왕(장양왕)이 되었고 여불위는 승상이 되었다.`),_(`가난한 볼모와 엮이면 손해라며 모른 척했다`,`여불위는 남들이 보지 못한 가치를 알아보았다.`),_(`자초를 조나라 왕에게 넘겨 상을 받았다`,`여불위는 자초에게 모든 것을 걸었다.`)]}}],original:{text:`呂不韋賈邯鄲，見而憐之，曰：「此奇貨可居。」`,reading:`여불위고한단, 견이련지, 왈: 「차기화가거.」`,translation:`여불위가 한단에서 장사를 하다가 (자초를) 보고 딱하게 여겨 말했다. “이것은 사 둘 만한 진귀한 물건이다.”`},related:[{word:`新奇`,reading:`신기`,meaning:`새롭고 기이함`},{word:`貨物`,reading:`화물`,meaning:`실어 나르는 물건`},{word:`住居`,reading:`주거`,meaning:`머물러 삶, 사는 집`}],modern:`아무도 관심 없던 신인 작가의 첫 작품을 알아본 출판사는 기화가거라며 바로 계약했다.`}],ee=[{char:`鷄`,hun:`닭`,eum:`계`},{char:`口`,hun:`입`,eum:`구`},{char:`牛`,hun:`소`,eum:`우`},{char:`先`,hun:`먼저`,eum:`선`},{char:`從`,hun:`좇을`,eum:`종`},{char:`隗`,hun:`높을`,eum:`외`},{char:`始`,hun:`비로소`,eum  말.`,"cs-02":`큰일을 하려면 가까운 일, 나 자신부터 시작하라는 말.`,"cs-03":`하찮아 보이는 재주도 쓰일 때가 있다는 말.`,"cs-04":`남들이 몰라보는 좋은 기회를 알아보고 잡아 두는 것.`},re=[{word:`합종`,desc:`여섯 나라가 남북(세로)으로 손잡고 진나라에 맞서자는 계책.`},{word:`예물`,desc:`예의를 갖추어 주는 선물.`},{word:`함곡관`,desc:`진나라로 드나드는 길목의 관문.`},{word:`볼모`,desc:`약속을 지키는 증표로 다른 나라에 보내져 머무는 사람.`},{word:`서자`,desc:`정식 부인이 아닌 여인에게서 태어난 아들.`}],ie=`pack-fables`,ae=(e,t)=>({label:e,correct:!0,feedback:t}),oe=(e,t)=>({label:e,correct:!1,feedback:t}),se=[{id:`uh-01`,book:`uhwa`,pack:ie,idiom:`狐假虎威`,reading:`호가호위`,meaning:`여우가 호랑이의 위세를 빌린다. 남의 힘을 빌려 위세를 부림.`,source:`『전국책』 초책`,heroId:`gangeul`,era:`전국시대 · 기원전 4세기 중엽(초 선왕 때)`,scenes:[{text:`초나라 선왕이 신하들에게 물었다. 북쪽 나라들이 우리 재상 소해휼을 두려워한다는데 정말이냐고. 신하들은 아무도 대답하지 못했다.`},{text:`그때 강을이 이야기 하나를 들려주었다. 호랑이가 짐승을 잡아먹으려다 여우를 잡았는데, 여우가 말했다. “하늘의 임금님이 나를 모든 짐승의 우두머리로 정했으니 나를 먹으면 하늘의 명을 어기는 것이오.”`},{text:`여우는 덧붙였다. “못 믿겠으면 내 뒤를 따라와 보시오. 짐승들이 나를 보고 달아나지 않는지.” 호랑이는 여우 뒤를 따라 숲을 걸었다.`},{text:`짐승들은 둘을 보자마자 모두 달아났다. 호랑이는 그 모습을 보고 여우의 말이 맞다고 여겼다.`,choice:{prompt:`짐승들은 정말 무엇이 무서워서 달아났을까?`,options:[ae(`여우 뒤에 따라오는 호랑이가 무서워서`,`호랑이는 짐승들이 자기를 두려워한 줄 모르고 여우를 두려워한다고 여겼다. 강을은 “북쪽 나라들이 두려워하는 것은 소해휼이 아니라 그에게 맡기신 왕의 백만 군대입니다.”라고 말했다.`),oe(`여우가 정말 하늘이 정한 우두머리라서`,`여우의 말은 살아남으려고 지어낸 꾀였다.`),oe(`여우가 호랑이보다 힘이 세서`,`여우는 호랑이의 힘을 빌렸을 뿐이다.`)]}}],original:{text:`虎求百獸而食之，得狐。……獸見之皆走。虎不知獸畏己而走也，以爲畏狐也。`,reading:`호구백수이식지, 득호. …… 수견지개주. 호부지수외기이주야, 이위외호야.`,translation:`호랑이가 온갖 짐승을 찾아 잡아먹다가 여우를 잡았다. …… 짐승들이 그들을 보고 모두 달아났다. 호랑이는 짐승들이 자기를 두려워하여 달아난 줄 모르고, 여우를 두려워한다고 여겼다.`},related:[{word:`假面`,reading:`가면`,meaning:`얼굴을 가리는 탈`},{word:`威力`,reading:`위력`,meaning:`남을 누르는 강한 힘`},{word:`猛虎`,reading:`맹호`,meaning:`사나운 호랑이`}],modern:`반장 친구라는 이유로 다른 아이들에게 큰소리치던 그는 호가호위한다는 말을 들었다.`},{id:`uh-02`,book:`uhwa`,pack:ie,idiom:`畫蛇添足`,reading:`화사첨족`,meaning:`뱀을 그리고 발을 덧붙인다. 쓸데없는 일을 덧붙여 도리어 일을 그르침.`,source:`『전국책』 제책`,heroId:`jinjin`,era:`전국시대 · 기원전 323년 무렵`,scenes:[{text:`초나라 장군 소양이 위나라를 쳐서 크게 이기고, 그 기세로 제나라까지 치려 했다. 제나라를 위해 진진이 소양을 찾아가 이야기 하나를 들려주었다.`},{text:`초나라에 제사를 지낸 사람이 일꾼들에게 술 한 잔을 내렸다. 여럿이 마시기엔 모자라고 혼자 마시면 넉넉했다. 그래서 땅에 뱀을 먼저 그리는 사람이 마시기로 했다.`},{text:`한 사람이 가장 먼저 뱀을 다 그렸다. 그는 왼손으로 술잔을 들고, 오른손으로 계속 그리며 말했다. “나는 발까지 그릴 수 있지!”`},{text:`그가 뱀의 발을 다 그리기도 전이었다.`,choice:{prompt:`그다음 어떻게 되었을까?`,options:[ae(`다른 사람이 뱀을 다 그리고 잔을 빼앗아 마셨다`,`“뱀은 본래 발이 없는데 어찌 발을 그리오?” 발을 그린 사람은 끝내 술을 잃었다. 진진은 “장군은 이미 큰 공을 세웠는데 더 싸우다 지면 그 공마저 잃습니다.”라고 했고, 소양은 옳다고 여겨 군대를 거두었다.`),oe(`발까지 그린 뱀이 더 멋져서 상으로 두 잔을 받았다`,`뱀에게는 발이 없다. 덧붙인 발 때문에 뱀 그림이 아니게 되었다.`),oe(`모두 함께 나누어 마셨다`,`약속대로라면 먼저 그린 사람이 마셔야 했지만, 그는 쓸데없는 발을 그리다 기회를 잃었다.`)]}}],original:{text:`請畫地爲蛇，先成者飮酒。……蛇固無足，子安能爲之足？……爲蛇足者，終亡其酒。`,reading:`청화지위사, 선성자음주. …… 사고무족, 자안능위지족? …… 위사족자, 종망기주.`,translation:`땅에 뱀을 그려서 먼저 그린 사람이 술을 마시기로 하자. …… 뱀은 본래 발이 없는데 그대가 어찌 발을 그릴 수 있겠는가? …… 뱀의 발을 그린 사람은 끝내 그 술을 잃었다.`},related:[{word:`畫家`,reading:`화가`,meaning:`그림을 그리는 사람`},{word:`添加`,reading:`첨가`,meaning:`덧붙여 더함`},{word:`手足`,reading:`수족`,meaning:`손과 발`}],modern:`다 된 발표 자료에 효과를 잔뜩 덧붙이다 파일이 망가졌다. 화사첨족이었다.`},{id:`uh-03`,book:`uhwa`,pack:ie,idiom:`漁父之利`,reading:`어부지리`,meaning:`어부의 이익. 둘이 다투는 사이에 엉뚱한 사람이 이익을 얻음.`,source:`『전국책』 연책`,heroId:`sodae`,era:`전국시대 · 기원전 3세기 초(조 혜문왕 때)`,scenes:[{text:`조나라가 연나라를 치려 하자, 연나라를 위해 소대가 조나라 혜문왕을 찾아가 이야기 하나를 들려주었다. 소대는 합종을 펼친 소진의 동생이다.`},{text:`“이번에 오다가 역수를 건너는데, 조개가 볕을 쬐려고 껍데기를 벌리고 있었습니다. 그러자 도요새가 조개의 살을 쪼았고, 조개는 껍데기를 닫아 도요새의 부리를 꽉 물었습니다.”`},{text:`“도요새는 ‘오늘도 내일도 비가 오지 않으면 너는 말라 죽은 조개가 될 거다’ 하고, 조개는 ‘오늘도 내일도 내가 놓아주지 않으면 너는 죽은 도요새가 될 거다’ 했습니다. 둘은 서로 놓아주지 않았습니다.”`},{text:`그때 어부가 그 곁을 지나갔다.`,choice:{prompt:`서로 놓지 않던 조개와 도요새는 어떻게 되었을까?`,options:[ae(`어부가 둘을 한꺼번에 잡아갔다`,`소대는 “조나라와 연나라가 오래 싸워 백성이 지치면, 강한 진나라가 어부가 될까 두렵습니다.”라고 말했다. 혜문왕은 “옳다” 하고 연나라 치기를 그만두었다.`),oe(`도요새가 이겨서 조개를 먹었다`,`둘 다 버티기만 하다가 누구도 이기지 못했다.`),oe(`비가 와서 둘 다 살아 돌아갔다`,`다툼이 길어지는 사이 둘 다 어부에게 잡혔다.`)]}}],original:{text:`蚌方出曝，而鷸啄其肉，蚌合而拑其喙。……兩者不肯相舍，漁者得而幷禽之。`,reading:`방방출폭, 이휼탁기육, 방합이겸기훼. …… 양자불긍상사, 어자득이병금지.`,translation:`조개가 막 나와 볕을 쬐는데 도요새가 그 살을 쪼자, 조개가 껍데기를 닫아 도요새의 부리를 물었다. …… 둘이 서로 놓아주려 하지 않자, 어부가 와서 둘을 한꺼번에 잡았다.`},related:[{word:`漁船`,reading:`어선`,meaning:`고기잡이 배`},{word:`父母`,reading:`부모`,meaning:`아버지와 어머니`},{word:`便利`,reading:`편리`,meaning:`편하고 쓸모가 있음`}],modern:`두 후보가 서로 헐뜯는 사이 조용히 공약을 알린 세 번째 후보가 어부지리로 당선되었다.`},{id:`uh-04`,book:`uhwa`,pack:ie,idiom:`愚公移山`,reading:`우공이산`,meaning:`우공이 산을 옮긴다. 쉬지 않고 꾸준히 노력하면 아무리 큰일도 이룰 수 있음.`,source:`『열자』 탕문`,heroId:`ugong`,era:`『열자』에 실린 우화(시대를 정하지 않은 옛이야기)`,scenes:[{text:`태항산과 왕옥산은 둘레가 칠백 리, 높이가 만 길이나 되는 큰 산이었다. 그 북쪽에 아흔 살이 다 된 우공이 산을 마주 보고 살았는데, 드나들 때마다 산이 길을 막아 늘 멀리 돌아가야 했다.`},{text:`우공은 가족을 모아 의논했다. 다 함께 힘을 다해 험한 산을 깎아 남쪽까지 곧게 길을 내자고. 가족들은 찬성했고, 돌을 깨고 흙을 파서 삼태기에 담아 멀리 바닷가까지 날랐다. 한 번 다녀오는 데 한 해가 걸렸다.`},{text:`강가에 사는 지수라는 사람이 비웃었다. “당신은 너무 어리석구려. 그 나이에 남은 힘으로는 산의 풀 한 포기도 없애지 못할 텐데, 흙과 돌은 어찌하겠소?”`},{text:`우공이 길게 한숨을 쉬고 대답했다.`,choice:{prompt:`우공은 뭐라고 대답했을까?`,options:[ae(`내가 죽어도 아들이 있고, 아들은 손자를 낳아 자손이 끝없이 이어지는데 산은 더 커지지 않으니, 어찌 평평해지지 않겠소`,`지수는 대답할 말을 찾지 못했다. 이 말을 들은 산신이 두려워 하늘의 임금에게 알리자, 하늘의 임금은 우공의 정성에 감동해 힘센 신의 두 아들에게 두 산을 업어 다른 곳으로 옮기게 했다.`),oe(`그 말이 맞으니 그만두겠소`,`우공은 멈추지 않았다.`),oe(`하늘에 빌어 산을 옮겨 달라고 하겠소`,`우공은 빌지 않고 대대로 이어서 하겠다고 했다. 하늘이 움직인 것은 그 꾸준함 때문이었다.`)]}}],original:{text:`北山愚公者，年且九十，面山而居。……子子孫孫無窮匱也，而山不加增，何苦而不平？`,reading:`북산우공자, 연차구십, 면산이거. …… 자자손손무궁궤야, 이산불가증, 하고이불평?`,translation:`북산의 우공은 나이가 아흔에 가까웠는데, 산을 마주 보고 살았다. …… 자손은 대대로 끝이 없는데 산은 더 높아지지 않으니, 어찌 평평해지지 않을까 걱정하겠는가?`},related:[{word:`移動`,reading:`이동`,meaning:`옮겨 움직임`},{word:`登山`,reading:`등산`,meaning:`산에 오름`},{word:`公平`,reading:`공평`,meaning:`어느 쪽으로도 치우치지 않고 고름`}],modern:`날마다 열 쪽씩 읽어 일 년 만에 두꺼운 역사책 열 권을 다 읽은 그는 우공이산을 보여 주었다.`}],ce=[{char:`狐`,hun:`여우`,eum:`호`},{char:`假`,hun:`거짓`,eum:`가`},{char:`虎`,hun:`범`,eum:`호`},{char:`威`,hun:`위엄`,eum:`위`},{char:`畫`,hun:`그림`,eum:`화`},{char:`蛇`,hun:`긴뱀`,eum:`사`},{char:`添`,hun:`더할`,eum:`첨`},{char:`足`,hun:`발`,eum:`족`},{char:`漁`,hun:`고기잡을`,eum:`어`},{char:`父`,hun:`아비`,eum:`부`},{char:`利`,hun:`이로울`,eum:`리`},{char:`愚`,hun:`어리석을`,eum:`우`},{char:`公`,hun:`공평할`,eum:`공`},{char:`移`,hun:`옮길`,eum:`이`},{char:`山`,hun:`메`,eum:`산`}],le=[{char:`求`,hun:`구할`,eum:`구`},{char:`百`,hun:`일백`,eum:`백`,note:`원문에서는 ‘온갖’`},{char:`獸`,hun:`짐승`,eum:`수`},{ch 바꾸지 않고 기다리기만 했다.`)]}}],original:{text:`田中有株，兔走觸株，折頸而死，因釋其耒而守株，冀復得兔。`,reading:`전중유주, 토주촉주, 절경이사, 인석기뢰이수주, 기부득토.`,translation:`밭 가운데 그루터기가 있었는데, 토끼가 달려가다 그루터기에 부딪혀 목이 부러져 죽었다. 그러자 (농부는) 쟁기를 놓고 그루터기를 지키며 다시 토끼를 얻기를 바랐다.`},related:[{word:`守備`,reading:`수비`,meaning:`지키고 막음`},{word:`株式`,reading:`주식`,meaning:`회사의 몫을 나눈 증서`},{word:`期待`,reading:`기대`,meaning:`어떤 일이 이루어지기를 바라며 기다림`}],modern:`작년에 찍어서 맞힌 문제를 믿고 올해도 공부 없이 찍기만 기다린 그는 수주대토의 농부와 같았다.`},{id:`hb-02`,book:`hanbi`,pack:pe,idiom:`濫竽充數`,reading:`남우충수`,meaning:`피리를 불 줄 모르면서 악사의 수를 채운다. 실력 없는 사람이 자리만 차지함.`,source:`『한비자』 내저설상`,heroId:`namgwak`,era:`전국시대 · 기원전 4세기 말(제 선왕·민왕 때)`,scenes:[{text:`제나라 선왕은 피리의 일종인 ‘우(竽)’ 연주를 좋아했다. 그런데 꼭 삼백 명이 한꺼번에 함께 부는 합주로만 들었다.`},{text:`남곽이라는 선비가 왕을 위해 우를 불겠다고 나섰다. 선왕은 기뻐하며 그에게도 다른 악사들처럼 나라의 곡식으로 녹봉을 주었다. 사실 그는 우를 불 줄 몰랐지만, 삼백 명 사이에 섞여 부는 척만 했다.`},{text:`세월이 흘러 선왕이 죽고 아들 민왕이 왕위에 올랐다. 민왕도 우 연주를 좋아했는데, 한 사람씩 따로 불게 해서 듣기를 좋아했다.`},{text:`이제 악사들은 차례로 왕 앞에서 혼자 우를 불어야 했다.`,choice:{prompt:`남곽 선비는 어떻게 했을까?`,options:[me(`자기 차례가 오기 전에 몰래 달아났다`,`여럿 속에 숨어 있을 때는 몰랐지만, 한 사람씩 들어 보자 실력이 없다는 것이 드러날 수밖에 없었다. 한비는 신하의 말을 하나하나 따로 들어 보아야 거짓을 가려낼 수 있다고 했다.`),he(`왕 앞에서 훌륭하게 연주해 큰 상을 받았다`,`그는 처음부터 우를 불 줄 몰랐다.`),he(`다른 악사에게 대신 불어 달라고 부탁했다`,`원전에는 그가 달아났다고만 적혀 있다.`)]}}],original:{text:`齊宣王使人吹竽，必三百人。……湣王立，好一一聽之，處士逃。`,reading:`제선왕사인취우, 필삼백인. …… 민왕립, 호일일청지, 처사도.`,translation:`제나라 선왕은 사람들에게 우를 불게 할 때 반드시 삼백 명이 함께 불게 했다. …… 민왕이 왕위에 오르자 한 사람씩 듣기를 좋아했고, 그 선비는 달아났다.`},related:[{word:`濫用`,reading:`남용`,meaning:`함부로 지나치게 씀`},{word:`充分`,reading:`충분`,meaning:`모자람 없이 넉넉함`},{word:`數學`,reading:`수학`,meaning:`수와 양을 다루는 학문`}],modern:`모둠 과제에서 이름만 올리고 아무것도 하지 않던 그는 혼자 발표하는 날 남우충수였음이 드러났다.`},{id:`hb-03`,book:`hanbi`,pack:pe,idiom:`三人成虎`,reading:`삼인성호`,meaning:`세 사람이 말하면 없던 호랑이도 만들어진다. 거짓말도 여럿이 하면 참말처럼 믿게 됨.`,source:`『한비자』 내저설상`,heroId:`banggong`,era:`전국시대 · 기원전 4세기(위나라)`,scenes:[{text:`위나라 신하 방공은 태자를 모시고 조나라 수도 한단에 볼모로 가게 되었다. 떠나기 전, 방공이 위나라 왕에게 물었다.`},{text:`“지금 한 사람이 시장에 호랑이가 나타났다고 하면 믿으시겠습니까?” 왕은 믿지 않는다고 했다. “두 사람이 그렇게 말하면요?” 왕은 여전히 믿지 않는다고 했다.`},{text:`“그러면 세 사람이 시장에 호랑이가 있다고 말하면 믿으시겠습니까?” 왕은 대답했다. “그렇다면 믿겠소.”`},{text:`방공이 말을 이었다.`,choice:{prompt:`방공은 왜 이런 질문을 했을까?`,options:[me(`자기가 떠난 뒤 자기를 헐뜯는 말이 여럿 들려와도 잘 살펴 달라고 부탁하려고`,`“시장에 호랑이가 없는 것은 분명한데 세 사람이 말하면 호랑이가 생깁니다. 한단은 시장보다 멀고, 저를 헐뜯을 사람은 셋보다 많을 것입니다.” 하지만 방공이 돌아왔을 때 왕은 끝내 그를 만나 주지 않았다.`),he(`시장에 정말 호랑이가 나타나서 조심하라고`,`시장에 호랑이는 없었다. 방공은 소문의 힘을 빗대어 말했다.`),he(`왕이 사람 말을 너무 안 믿는다고 꾸짖으려고`,`방공은 오히려 여러 사람이 같은 말을 하면 쉽게 믿게 된다는 점을 걱정했다.`)]}}],original:{text:`夫市之無虎也明矣，然而三人言而成虎。`,reading:`부시지무호야명의, 연이삼인언이성호.`,translation:`시장에 호랑이가 없다는 것은 분명합니다. 그런데도 세 사람이 말하면 호랑이가 생깁니다.`},related:[{word:`三角`,reading:`삼각`,meaning:`세 개의 모서리, 세모`},{word:`成功`,reading:`성공`,meaning:`목적한 바를 이룸`},{word:`虎皮`,reading:`호피`,meaning:`호랑이의 가죽`}],modern:`단체 대화방에 같은 헛소문이 여러 번 올라오자 모두 사실처럼 믿었다. 삼인성호가 따로 없었다.`},{id:`hb-04`,book:`hanbi`,pack:pe,idiom:`老馬之智`,reading:`노마지지`,meaning:`늙은 말의 지혜. 하찮아 보여도 저마다 잘하는 것이 있음. 경험 많은 이의 지혜를 빌림.`,source:`『한비자』 설림상`,heroId:`gwanjung`,era:`춘추시대 · 기원전 663년 무렵(제 환공 때)`,scenes:[{text:`제나라 환공이 북쪽의 고죽국을 치러 갔다. 재상 관중과 대부 습붕이 함께 따라갔다. 봄에 떠난 군대는 겨울이 되어서야 돌아오는 길에 올랐다.`},{text:`돌아오는 길에 군대는 낯선 산길에서 그만 길을 잃고 말았다. 이리저리 헤매도 길이 보이지 않았다.`},{text:`그때 관중이 말했다. “늙은 말의 지혜를 쓸 만합니다.”`,choice:{prompt:`관중은 어떻게 했을까?`,options:[me(`늙은 말을 풀어 놓고 그 뒤를 따라가게 했다`,`늙은 말은 지나온 길을 기억하고 있었고, 군대는 마침내 길을 찾았다. 한비는 “관중과 습붕 같은 지혜로운 사람도 모르는 것은 늙은 말과 개미에게 배웠는데, 지금 사람들은 성인의 지혜를 배울 줄 모른다”라고 했다.`),he(`가장 빠른 젊은 말을 골라 앞장세웠다`,`관중은 힘센 말이 아니라 길을 아는 늙은 말을 골랐다.`),he(`날이 풀릴 때까지 그 자리에 진을 치고 기다렸다`,`관중은 기다리지 않고 늙은 말의 경험을 빌렸다.`)]}}],original:{text:`春往冬反，迷惑失道。管仲曰：「老馬之智可用也。」乃放老馬而隨之，遂得道。`,reading:`춘왕동반, 미혹실도. 관중왈: 「노마지지가용야.」 내방노마이수지, 수득도.`,translation:`봄에 갔다가 겨울에 돌아오는데, 헷갈려서 길을 잃었다. 관중이 말했다. “늙은 말의 지혜를 쓸 만합니다.” 그래서 늙은 말을 풀어 놓고 그 뒤를 따라가 마침내 길을 찾았다.`},related:[{word:`老人`,reading:`노인`,meaning:`나이가 많은 사람`},{word:`智慧`,reading:`지혜`,meaning:`사물의 이치를 깨닫고 잘 처리하는 능력`},{word:`敬老`,reading:`경로`,meaning:`노인을 공경함`}],modern:`처음 가는 산에서 길을 잃은 우리는 그 산을 오래 다닌 할아버지께 길을 여쭈었다. 노마지지였다.`}],_e=[{char:`守`,hun:`지킬`,eum:`수`},{char:`株`,hun:`그루`,eum:`주`},{char:`待` um:`실`},{char:`道`,hun:`길`,eum:`도`},{char:`仲`,hun:`버금`,eum:`중`},{char:`乃`,hun:`이에`,eum:`내`},{char:`放`,hun:`놓을`,eum:`방`},{char:`隨`,hun:`따를`,eum:`수`},{char:`遂`,hun:`드디어`,eum:`수`},{char:`慧`,hun:`슬기로울`,eum:`혜`},{char:`敬`,hun:`공경`,eum:`경`}],ye=[{id:`hanbi`,name:`한비`,hanjaName:`韓非`,title:`『한비자』를 쓴 사상가`,skill:`insight`,skillName:`때에 맞게`,skillDesc:`정답의 첫 글자를 보여 준다.`},{id:`namgwak`,name:`남곽 선비`,hanjaName:`南郭處士`,title:`부는 척하던 악사`,skill:`shield`,skillName:`무리 속에 숨기`,skillDesc:`다음 오답 한 번은 체력이 줄지 않는다.`},{id:`banggong`,name:`방공`,hanjaName:`龐恭`,title:`위나라 신하`,skill:`reveal`,skillName:`소문 가려내기`,skillDesc:`오답 보기 두 개를 지운다.`},{id:`gwanjung`,name:`관중`,hanjaName:`管仲`,title:`제나라 재상`,skill:`heal`,skillName:`늙은 말의 길`,skillDesc:`체력을 1 회복한다.`}],be={"hb-01":`한 번 운 좋았던 일만 믿고, 노력은 안 하며 같은 행운을 기다리는 것.`,"hb-02":`실력도 없으면서 여럿 사이에 끼어 자리만 차지하는 것.`,"hb-03":`없는 일도 여러 사람이 말하면 사실처럼 믿게 된다는 말.`,"hb-04":`경험 많은 사람(늙은 말)에게도 배울 지혜가 있다는 말.`},xe=[{word:`그루터기`,desc:`나무를 베고 남은 밑동.`},{word:`쟁기`,desc:`소가 끌어 밭을 가는 농기구.`},{word:`녹봉`,desc:`나라에서 벼슬아치에게 주던 곡식이나 돈.`},{word:`고죽국`,desc:`제나라 북쪽에 있던 작은 나라.`}],Se=`pack-threekingdoms`,Ce=(e,t)=>({label:e,correct:!0,feedback:t}),we=(e,t)=>({label:e,correct:!1,feedback:t}),Te=[{id:`sg-01`,book:`samguk`,pack:Se,idiom:`三顧草廬`,reading:`삼고초려`,meaning:`초가집을 세 번 찾아간다. 훌륭한 사람을 얻기 위해 정성을 다해 거듭 찾아감.`,source:`『삼국지』 촉서 제갈량전(출사표)`,heroId:`yubi`,era:`후한 말 · 207년`,scenes:[{text:`후한 말, 유비는 형주에 머물며 큰 뜻을 품었지만 아직 자리 잡을 땅도 없었다. 그때 서서가 말했다. “제갈공명은 누워 있는 용, 와룡입니다. 장군께서 만나 보시겠습니까?”`},{text:`유비가 데려오라고 하자 서서는 고개를 저었다. “이 사람은 찾아가서 만날 수는 있어도 불러올 수는 없습니다. 장군께서 몸을 낮추어 찾아가셔야 합니다.”`},{text:`유비는 직접 제갈량이 사는 초가로 찾아갔다. 한 번, 두 번으로는 만나지 못했고, 모두 세 번을 찾아가서야 비로소 마주 앉을 수 있었다.`},{text:`유비는 한나라를 다시 일으킬 방법을 물었다.`,choice:{prompt:`제갈량은 유비에게 어떤 계책을 들려주었을까?`,options:[Ce(`형주와 익주를 차지하고 손권과 손잡아 조조에 맞서라`,`천하를 셋으로 나누어 보는 이 계책에 유비는 감탄했고, 제갈량은 유비를 돕기로 했다. 뒷날 제갈량은 출사표에 “선제께서 신을 초가로 세 번 찾아오셨다”라고 적었다.`),we(`조조의 힘이 너무 세니 조조 밑으로 들어가라`,`제갈량은 조조와는 다툴 수 없지만 손권과 손잡으면 맞설 수 있다고 했다.`),we(`먼저 손권을 쳐서 강동을 차지하라`,`제갈량은 손권을 적이 아니라 손잡을 상대로 보았다.`)]}}],original:{text:`先帝不以臣卑鄙，猥自枉屈，三顧臣於草廬之中，諮臣以當世之事。`,reading:`선제불이신비비, 외자왕굴, 삼고신어초려지중, 자신이당세지사.`,translation:`선제(유비)께서는 신을 낮고 보잘것없다 여기지 않으시고, 몸소 몸을 굽혀 세 번이나 신을 초가로 찾아오시어 당대의 일을 물으셨습니다. (제갈량 「출사표」)`},related:[{word:`顧客`,reading:`고객`,meaning:`가게를 찾아오는 손님`},{word:`草木`,reading:`초목`,meaning:`풀과 나무`},{word:`三寸`,reading:`삼촌`,meaning:`아버지의 형제`}],modern:`그 감독은 최고의 선수를 데려오려고 세 번이나 찾아가 설득했다. 삼고초려 끝에 계약이 이루어졌다.`},{id:`sg-02`,book:`samguk`,pack:Se,idiom:`水魚之交`,reading:`수어지교`,meaning:`물과 물고기의 사귐. 떨어질 수 없을 만큼 아주 가까운 사이.`,source:`『삼국지』 촉서 제갈량전`,heroId:`jegalryang`,era:`후한 말 · 207~208년`,scenes:[{text:`제갈량을 맞아들인 유비는 날마다 그와 나랏일을 의논했다. 두 사람의 사이는 날이 갈수록 가까워졌다.`},{text:`오랫동안 유비와 함께 싸워 온 관우와 장비는 이 모습이 못마땅했다. 새로 온 젊은이를 너무 아낀다고 여긴 것이다.`},{text:`유비는 두 사람을 불러 타일렀다.`,choice:{prompt:`유비는 관우와 장비에게 뭐라고 했을까?`,options:[Ce(`“나에게 공명이 있는 것은 물고기에게 물이 있는 것과 같다. 다시는 말하지 말라.”`,`관우와 장비는 그제야 불평을 멈추었다. 물고기가 물 없이 살 수 없듯, 유비에게 제갈량은 꼭 필요한 사람이었다.`),we(`“그대들이 싫다면 공명을 멀리하겠다.”`,`유비는 제갈량을 멀리하지 않았다.`),we(`“공명과 그대들 중 하나만 곁에 두겠다.”`,`유비는 셋 모두를 아꼈고, 다만 제갈량이 꼭 필요한 이유를 물고기와 물에 빗대어 설명했다.`)]}}],original:{text:`孤之有孔明，猶魚之有水也。願諸君勿復言。`,reading:`고지유공명, 유어지유수야. 원제군물부언.`,translation:`내가 공명을 얻은 것은 물고기가 물을 얻은 것과 같다. 그대들은 다시는 이 일을 말하지 말기 바란다.`},related:[{word:`人魚`,reading:`인어`,meaning:`몸 위는 사람, 아래는 물고기인 상상 속 동물`},{word:`魚類`,reading:`어류`,meaning:`물고기 무리`},{word:`交通`,reading:`교통`,meaning:`사람이나 물건이 오가는 일`}],modern:`어릴 때부터 서로를 가장 잘 아는 두 친구는 수어지교라 할 만했다.`},{id:`sg-03`,book:`samguk`,pack:Se,idiom:`刮目相對`,reading:`괄목상대`,meaning:`눈을 비비고 다시 본다. 학식이나 재주가 몰라볼 만큼 부쩍 늚.`,source:`『삼국지』 오서 여몽전 배송지 주(『강표전』)`,heroId:`yeomong`,era:`삼국시대 · 3세기 초(오나라)`,scenes:[{text:`오나라 장수 여몽은 싸움은 잘했지만 글공부는 하지 않았다. 손권이 높은 자리에 올랐으니 책을 읽으라고 권하자, 여몽은 군대 일이 바빠 시간이 없다고 했다.`},{text:`손권이 말했다. “그대에게 학자가 되라는 것이 아니라 지난 일을 두루 살펴보라는 것이다. 그대가 나보다 바쁘겠는가? 나도 늘 책을 읽어 크게 도움이 되었다.” 여몽은 그때부터 부지런히 공부했다.`},{text:`얼마 뒤 노숙이 여몽을 찾아와 이야기를 나누다가 깜짝 놀랐다. “이제 그대는 예전 오나라의 아몽이 아니구려!” 아몽은 공부하지 않던 시절의 여몽을 부르던 이름이었다.`},{text:`여몽이 빙그레 웃으며 대답했다.`,choice:{prompt:`여몽은 뭐라고 대답했을까?`,options:[Ce(`“선비는 헤어진 지 사흘이면 눈을 비비고 다시 보아야 합니다.”`,`노숙은 여몽의 어머니께 절하고 벗이 되어 돌아갔다. 꾸준히 배우는 사람은 짧은 사이에도 몰라보게 달라진다.`),we(`“저는 예전과 똑같습니다.”`,`노숙이 놀랄 만큼 여몽은 달라져 있었다.`),we(`“책은 아직 한 권도 읽지 못했습니다.”`,`여몽은 손권의 말을 듣고 부지런히 공부했다.`)]}}],original:{text:`士別三日，即更刮目相待，大兄何見事之晩乎！`,reading:`사별삼일, 즉갱괄목상대, 대형하견사지만호!`,translation:`선비는 헤어진 지 사흘이면 곧 눈을 비비고 다시 대해야 하는데, 형님은 어찌 이제야 알아보십니까! (원문은 ‘相待’로 썼고, 성어로는 ‘相對’로 쓴다)`},related:[{word:`目標`,reading:`목표`,meaning:`이루려고 하는 목적이 되는 대상`},{word:`對話`,reading:`대화`,meaning:`마주 대하여 이야기를 나눔`},{word:`相談`,reading:`상담`,meaning:`문제를 풀려고 서로 의논함`}],modern:`여름 방학 동안 날마다 그림을 연습한 친구의 실력이 괄목상대하게 늘었다.`},{id:`sg-04`,book:`samguk`,pack:Se,idiom:`七縱七擒`,reading:`칠종칠금`,meaning:`일곱 번 놓아주고 일곱 번 사로잡는다. 상대가 마음으로 따르게 함.`,source:`『삼국지』 촉서 제갈량전 배송지 주(『한진춘추』)`,heroId:`maenghoek`,era:`삼국시대 · 225년(촉한)`,scenes:[{text:`촉한의 승상 제갈량이 남쪽 지방을 평정하러 나섰다. 그곳 사람들에게 존경받는 우두머리 맹획을 사로잡았다.`},{text:`제갈량은 맹획에게 진영을 구경시켜 주고 물었다. “우리 군대가 어떠하오?” 맹획이 말했다. “전에는 사정을 몰라 졌지만, 이 정도라면 쉽게 이길 수 있겠소.”`},{text:`제갈량은 웃으며 맹획을 풀어 주고 다시 싸우게 했다. 그렇게 일곱 번을 놓아주고 일곱 번을 사로잡았다.`},{text:`일곱 번째에도 제갈량은 맹획을 보내 주려 했다.`,choice:{prompt:`맹획은 어떻게 했을까?`,options:[Ce(`떠나지 않고 “공은 하늘의 위엄을 지니셨으니 남쪽 사람들은 다시는 배반하지 않겠습니다” 했다`,`제갈량은 남쪽 땅을 그곳 우두머리들에게 맡기고 군대를 거두었다. 힘으로 누르기보다 마음으로 따르게 한 것이다.`),we(`또 달아나 여덟 번째 싸움을 걸었다`,`맹획은 더는 싸우지 않고 마음으로 따랐다.`),we(`몰래 제갈량을 사로잡았다`,`맹획은 제갈량에게 진심으로 굴복했다.`)]}}],original:{text:`七縱七禽，而亮猶遣獲。獲止不去，曰：「公，天威也，南人不復反矣。」`,reading:`칠종칠금, 이량유견획. 획지불거, 왈: 「공, 천위야, 남인불부반의.」`,translation:`일곱 번 놓아주고 일곱 번 사로잡았는데도 제갈량은 또 맹획을 보내려 했다. 맹획은 머물러 떠나지 않으며 말했다. “공은 하늘의 위엄을 지니셨으니, 남쪽 사람들은 다시는 배반하지 않을 것입니다.” (원문은 ‘擒’을 ‘禽’으로 썼다)`},related:[{word:`七夕`,reading:`칠석`,meaning:`음력 칠월 칠일 밤`},{word:`放縱`,reading:`방종`,meaning:`제멋대로 함부로 행동함`}],modern:`선생님은 장난이 심한 친구를 벌주기보다 몇 번이고 기회를 주며 마음을 얻었다. 칠종칠금이었다.`}],Ee=[{char:`三`,hun:`석`,eum:`삼`},{char:`顧`,hun:`돌아볼`,eum:`고`},{char:`草`,hun:`풀`,eum:`초`},{char:`廬`,hun:`농막집`,eum:`려`},{char:`魚`,hun:`물고기`,eum:`어`},{char:`刮`,hun:`긁을`,eum:`괄`},{char:`目`,hun:`눈`,eum:`목`},{char:`相`,hun:`서로`,eum:`상`},{char:`對`,hun:`대할`,eum:`대`},{char:`七`,hun:`일곱`,eum:`칠`},{char:` ed:[{word:`種苗`,reading:`종묘`,meaning:`씨앗과 모종`},{word:`助言`,reading:`조언`,meaning:`도움이 되도록 말을 거들어 줌`},{word:`成長`,reading:`성장`,meaning:`자라서 점점 커짐`}],modern:`아이가 빨리 잘하길 바라며 학원을 열 군데나 보낸 것은 알묘조장이었다. 아이는 오히려 공부가 싫어졌다.`},{id:`mz-02`,book:`maengja`,pack:je,idiom:`浩然之氣`,reading:`호연지기`,meaning:`넓고 큰 기운. 하늘과 땅 사이에 가득 찰 만큼 크고 바른 마음의 힘.`,source:`『맹자』 공손추상`,heroId:`maengja`,era:`전국시대 · 기원전 4세기 말(맹자)`,scenes:[{text:`공손추가 맹자에게 물었다. “선생님께서는 무엇을 잘하십니까?” 맹자가 대답했다. “나는 남의 말을 잘 알아듣고, 나의 호연지기를 잘 기른다.”`},{text:`“호연지기가 무엇입니까?” 맹자는 말로 하기 어렵다고 했다. 그것은 더없이 크고 굳센 기운이어서, 곧게 길러 해치지 않으면 하늘과 땅 사이를 가득 채운다고 했다.`},{text:`공손추는 그 기운을 어떻게 길러야 하는지 다시 물었다.`,choice:{prompt:`맹자는 호연지기를 어떻게 기른다고 했을까?`,options:[Me(`옳은 일을 꾸준히 쌓아 기르되, 잊지도 말고 억지로 서두르지도 말라`,`맹자는 의로운 일을 하나하나 쌓아야 생기는 기운이라고 했다. 그리고 억지로 서두르면 안 된다며, 싹을 뽑아 올린 송나라 농부 이야기를 덧붙였다.`),Ne(`한 번 크게 옳은 일을 하면 저절로 생긴다`,`맹자는 한 번의 행동이 아니라 꾸준히 쌓아야 한다고 했다.`),Ne(`남을 이기는 싸움에서 생긴다`,`호연지기는 남을 이기는 힘이 아니라 부끄러움 없는 바른 마음에서 나온다.`)]}}],original:{text:`我善養吾浩然之氣。……其爲氣也，至大至剛，以直養而無害，則塞于天地之閒。`,reading:`아선양오호연지기. …… 기위기야, 지대지강, 이직양이무해, 즉색우천지지간.`,translation:`나는 나의 호연지기를 잘 기른다. …… 그 기운은 더없이 크고 더없이 굳세어서, 곧게 길러 해치지 않으면 하늘과 땅 사이를 가득 채운다.`},related:[{word:`浩大`,reading:`호대`,meaning:`매우 넓고 큼`},{word:`天然`,reading:`천연`,meaning:`사람의 힘을 더하지 않은 저절로 된 상태`},{word:`氣分`,reading:`기분`,meaning:`마음에 생기는 즐거움이나 불쾌함 같은 느낌`}],modern:`탁 트인 바다를 보며 크게 소리친 친구는 가슴에 호연지기가 가득 차는 것 같다고 했다.`},{id:`mz-03`,book:`maengja`,pack:je,idiom:`緣木求魚`,reading:`연목구어`,meaning:`나무에 올라가 물고기를 구한다. 방법이 잘못되어 목적을 이룰 수 없음.`,source:`『맹자』 양혜왕상`,heroId:`seonwang`,era:`전국시대 · 기원전 4세기 말(제 선왕 때)`,scenes:[{text:`제나라 선왕은 군대를 일으켜 이웃 나라들을 굴복시키고 천하를 차지하고 싶어 했다. 맹자는 왕이 정말 바라는 것이 무엇인지 물었다.`},{text:`왕이 웃기만 하고 대답하지 않자 맹자가 말했다. “땅을 넓히고 사방의 나라들을 따르게 하려는 것이겠지요. 그런데 지금의 방법으로 그것을 구하는 것은 나무에 올라가 물고기를 구하는 것과 같습니다.”`},{text:`왕이 놀라 물었다. “그렇게까지 심하단 말이오?”`},{text:`맹자가 대답했다.`,choice:{prompt:`맹자는 왕의 방법이 나무 위에서 물고기를 찾는 것보다 무엇이 더 나쁘다고 했을까?`,options:[Me(`나무 위에서는 물고기를 못 얻을 뿐 탈은 없지만, 전쟁으로 천하를 얻으려 하면 반드시 재앙이 따른다`,`맹자는 백성을 아끼는 어진 정치를 펴면 천하 사람들이 스스로 제나라로 모여들 것이라고 했다. 힘으로 빼앗기 다. 인상여는 그를 피했고, 길에서 마주치면 수레를 돌렸다.`},{text:`비겁하다는 부하들에게 인상여는 말했다. 강한 진나라가 조나라를 치지 못하는 것은 두 사람이 있기 때문이며, 두 호랑이가 싸우면 둘 다 살아남지 못한다고.`},{text:`그 말이 염파의 귀에 들어갔다.`,choice:{prompt:`염파는 어떻게 했을까?`,options:[b(`웃통을 벗고 가시나무를 지고 찾아가 사죄했다`,`부형청죄(負荊請罪). 두 사람은 목숨을 함께할 벗이 되었다.`),x(`더 크게 화를 내며 결투를 청했다`,`염파는 나라를 먼저 생각한 인상여의 뜻을 알아들었다.`),x(`벼슬을 버리고 고향으로 떠났다`,`염파는 조정에 남아 인상여와 손을 잡았다.`)]}}],original:{text:`卒相與驩，爲刎頸之交。`,reading:`졸상여환, 위문경지교.`,translation:`마침내 서로 기뻐하며, 목을 베어도 변치 않을 사귐을 맺었다.`},related:[{word:`交友`,reading:`교우`,meaning:`벗을 사귐`},{word:`外交`,reading:`외교`,meaning:`다른 나라와 맺는 관계`},{word:`交換`,reading:`교환`,meaning:`서로 바꿈`}],modern:`창업 초기의 위기를 함께 넘긴 두 공동대표의 사이는 문경지교라 부를 만했다.`},{id:`sagi-03`,book:`sagi`,idiom:`囊中之錐`,reading:`낭중지추`,meaning:`주머니 속 송곳은 끝이 드러나듯, 재능 있는 사람은 저절로 드러남.`,source:`『사기』 평원군우경열전`,heroId:`mosu`,era:`전국시대 · 기원전 257년`,scenes:[{text:`진나라 군대가 조나라 수도 한단을 에워쌌다. 평원군은 초나라에 구원을 청하러 갈 식객 스무 명을 골랐는데, 한 사람이 모자랐다.`},{text:`모수가 스스로 나섰다. 평원군은 현명한 선비는 주머니 속 송곳처럼 끝이 곧 드러나는 법인데, 그대는 3년 동안 이름이 들리지 않았다고 했다.`},{text:`모수는 물러서지 않았다.`,choice:{prompt:`모수의 대답은?`,options:[b(`그래서 오늘 주머니에 넣어 달라는 것입니다. 일찍 넣었다면 자루까지 빠져나왔을 겁니다`,`모수는 초나라 왕 앞에서 칼을 쥐고 담판을 지어 동맹을 끌어냈다. 스스로 나선 일을 모수자천(毛遂自薦)이라 한다.`),x(`그렇다면 물러나겠습니다`,`모수는 기회를 스스로 만들었다.`),x(`다른 식객을 대신 추천하겠습니다`,`모수는 자기 자신을 추천했다.`)]}}],original:{text:`夫賢士之處世也，譬若錐之處囊中，其末立見。`,reading:`부현사지처세야, 비약추지처낭중, 기말입현.`,translation:`무릇 현명한 선비가 세상에 있는 것은 송곳이 주머니 속에 있는 것과 같아서, 그 끝이 곧 드러난다.`},related:[{word:`中心`,reading:`중심`,meaning:`한가운데`},{word:`集中`,reading:`집중`,meaning:`한곳으로 모음`},{word:`中間`,reading:`중간`,meaning:`두 사물의 사이`}],modern:`신입이었지만 낭중지추라, 첫 발표부터 모두의 눈에 띄었다.`},{id:`sagi-04`,book:`sagi`,idiom:`指鹿爲馬`,reading:`지록위마`,meaning:`사슴을 가리켜 말이라 함. 윗사람을 속여 권세를 부리거나, 옳고 그름을 억지로 뒤바꿈.`,source:`『사기』 진시황본기`,heroId:`jogo`,era:`진나라 말 · 기원전 207년`,scenes:[{text:`진시황이 죽은 뒤, 환관 조고는 이세 황제를 세우고 권력을 쥐었다.`},{text:`반란을 꾀하던 조고는 신하들이 자기를 따를지 시험하려고, 이세에게 사슴 한 마리를 바치며 말이라고 했다.`},{text:`이세는 웃으며 사슴을 말이라 하느냐고 신하들에게 물었다.`,choice:{prompt:`신하들은 어떻게 답했을까?`,options:[b(`어떤 이는 입을 다물고, 어떤 이는 말이라 하고, 어떤 이는 사슴이라 했다`,`조고는 사슴이라 답한 신하들을 몰래 법으로 해쳤다. 그 뒤로 신하들은 모두 조고를 두려워했다.`),x(`모두 사슴이라고 바로잡았다`,`두려움 때문에 많은 신하가 진실을 말하지 못했다.`),x(`모두 웃으며 넘어갔다`,`이 시험은 웃고 넘길 일이 아니었다.`)]}}],original:{text:`持鹿獻於二世，曰：「馬也。」`,reading:`지록헌어이세, 왈: 「마야.」`,translation:`사슴을 끌고 와 이세에게 바치며 “말입니다.” 하였다.`},related:[{word:`指示`,reading:`지시`,meaning:`가리켜 보임, 일러서 시킴`},{word:`指摘`,reading:`지적`,meaning:`꼭 집어서 가리킴`},{word:`指名`,reading:`지명`,meaning:`여럿 중 누구를 지정함`}],modern:`명백한 수치를 두고도 문제없다고 우기는 보고서는 지록위마라는 비판을 받았다.`},{id:`sagi-05`,book:`sagi`,idiom:`背水之陣`,reading:`배수지진`,meaning:`물을 등지고 친 진. 물러설 곳 없이 목숨을 걸고 맞서는 각오.`,source:`『사기』 회음후열전`,heroId:`hansin`,era:`초한전쟁 · 기원전 204년 무렵`,scenes:[{text:`한나라 장수 한신은 수만의 군사로, 20만이라 일컫는 조나라 군대와 맞서야 했다.`},{text:`한신은 1만 명을 먼저 보내 강을 등지고 진을 치게 했다. 조나라 군사들은 병법도 모른다며 비웃었다.`},{text:`물러설 곳 없는 병사들은 죽기로 싸웠고, 그사이 숨겨 둔 기병이 조나라 성채에 한나라 깃발을 꽂았다. 승리 뒤 장수들이 까닭을 물었다.`,choice:{prompt:`한신이 든 병법은?`,options:[b(`죽을 땅에 빠뜨린 뒤에야 산다`,`陷之死地而後生. 물러설 곳을 없애 병사들의 힘을 끌어낸 것이다.`),x(`산을 오른쪽과 뒤에, 물을 앞과 왼쪽에 두라`,`그것은 장수들이 알던 병법의 상식이었다. 한신은 그 상식을 거꾸로 썼다.`),x(`적을 알고 나를 알면 백 번 싸워도 위태롭지 않다`,`손자병법의 유명한 구절이지만, 이 장면에서 한신이 든 말은 아니다.`)]}}],original:{text:`乃使萬人先行，出，背水陳。`,reading:`내사만인선행, 출, 배수진.`,translation:`이에 1만 명을 먼저 보내 나아가 강을 등지고 진을 치게 하였다. (원문에서는 ‘陣’을 ‘陳’으로 썼다)`},related:[{word:`背景`,reading:`배경`,meaning:`뒤쪽의 경치, 뒤에서 받쳐 주는 힘`},{word:`背信`,reading:`배신`,meaning:`믿음을 저버림`},{word:`水道`,reading:`수도`,meaning:`물이 흐르는 길`}],modern:`마지막 투자 유치를 앞둔 팀은 배수지진의 각오로 출시일을 맞췄다.`},{id:`sagi-06`,book:`sagi`,idiom:`四面楚歌`,reading:`사면초가`,meaning:`사방이 적에게 둘러싸여 도움받을 곳 없는 외로운 처지.`,source:`『사기』 항우본기`,heroId:`hangu`,era:`초한전쟁 · 기원전 202년`,scenes:[{text:`천하를 다투던 초나라 항우는 해하에서 한나라 군대에 겹겹이 포위되었다. 군사는 줄고 식량도 떨어졌다.`},{text:`밤이 깊자 사방의 한나라 진영에서 초나라 노래가 들려왔다.`},{text:`항우는 크게 놀랐다.`,choice:{prompt:`항우는 무엇이라 생각했을까?`,options:[b(`한나라가 이미 초나라 땅을 모두 차지했단 말인가`,`항우는 “어찌 초나라 사람이 이리도 많은가” 하고 탄식했다.`),x(`우리 원군이 마침내 도착했다`,`노래는 적진에서 들려왔다.`),x(`적이 지쳐 고향을 그리워하고 있다`,`항우가 느낀 것은 희망이 아니라 고립이었다.`)]}}],original:{text:`夜聞漢軍四面皆楚歌，項王乃大驚曰：「漢皆已得楚乎？是何楚人之多也！」`,reading:`야문한군사면개초가, 항왕내대경왈: 「한개이득초호? 시하초인지다야!」`,translation:`밤에 한나라 군대가 사방에서 모두 초나라 노래를 부르는 것을 듣고, 항왕이 크게 놀라 말하였다. “한나라가 이미 초나라를 다 얻었단 말인가? 어찌 이리도 초나라 사람이 많은가!”`},related:[{word:`四方`,reading:`사방`,meaning:`동서남북 네 방위, 여러 곳`},{word:`面談`,reading:`면담`,meaning:`서로 만나서 이야기함`},{word:`歌手`,reading:`가수`,meaning:`노래 부르는 것이 직업인 사람`}],modern:`원자재 값 급등에 수요 감소까지 겹쳐 업계는 사면초가에 빠졌다.`},{id:`sagi-07`,book:`sagi`,idiom:`兔死狗烹`,reading:`토사구팽`,meaning:`토끼를 잡고 나면 사냥개를 삶는다. 쓸모 있을 때 쓰고 필요가 없어지면 버림.`,source:`『사기』 월왕구천세가`,heroId:`beomnyeo`,era:`춘추시대 말 · 기원전 473년 무렵`,scenes:[{text:`월왕 구천은 오랜 복수 끝에 오나라를 무너뜨렸다. 그 곁에는 일등 공신 범려와 문종이 있었다.`},{text:`범려는 승리 직후 벼슬을 버리고 떠났다. 그리고 남아 있던 문종에게 편지를 보냈다.`},{text:`편지에는 짧은 경고가 담겨 있었다.`,choice:{prompt:`범려가 쓴 경고는?`,options:[b(`나는 새가 다하면 좋은 활은 감춰지고, 교활한 토끼가 죽으면 사냥개는 삶긴다`,`범려는 구천이 고난은 함께해도 즐거움은 함께할 사람이 아니라고 했다. 떠나지 않은 문종은 결국 자결을 명받았다.`),x(`공을 세웠으니 큰 상을 기다리라`,`범려는 정반대로 내다보았다.`),x(`오나라의 남은 무리를 경계하라`,`범려가 경계한 것은 자기 왕이었다.`)]}}],original:{text:`蜚鳥盡，良弓藏；狡兔死，走狗烹。`,reading:`비조진, 양궁장; 교토사, 주구팽.`,translation:`나는 새가 다 잡히면 좋은 활은 감추어지고, 교활한 토끼가 죽으면 사냥개는 삶아진다.`},related:[{word:`死亡`,reading:`사망`,meaning:`사람이 죽음`},{word:`生死`,reading:`생사`,meaning:`삶과 죽음`},{word:`必死`,reading:`필사`,meaning:`죽을 각오로 힘씀`}],modern:`프로젝트가 끝나자마자 핵심 개발자를 내보낸 회사에 토사구팽이라는 비판이 쏟아졌다.`},{id:`sagi-08`,book:`sagi`,idiom:`管鮑之交`,reading:`관포지교`,meaning:`관중과 포숙아의 사귐. 서로 깊이 이해하고 믿는 변함없는 우정.`,source:`『사기』 관안열전`,heroId:`posuka`,era:`춘추시대 · 기원전 7세기`,scenes:[{text:`제나라의 관중과 포숙아는 젊어서부터 벗이었다. 함께 장사하면 관중이 이익을 더 가져갔지만, 포숙아는 관중이 가난한 줄 알았기에 탓하지 않았다.`},{text:`관중이 싸움에서 세 번 달아나도, 벼슬에서 세 번 쫓겨나도 포숙아는 그를 겁쟁이나 못난이로 여기지 않았다. 늙은 어머니가 있고, 아직 때를 만나지 못했을 뿐이라 보았다.`},{text:`훗날 관중은 환공의 반대편에 섰다가 붙잡혔다. 포숙아는 환공에게 관중을 재상으로 추천했다.`,choice:{prompt:`관중이 남긴 말은?`,options:[b(`나를 낳은 이는 부모요, 나를 알아준 이는 포숙아다`,`관중은 환공을 도와 제나라를 천하의 패자로 만들었다.`),x(`나는 내 힘만으로 여기까지 왔다`,`관중은 평생 포숙아의 믿음을 잊지 않았다.`),x(`포숙아에게 진 빚은 이제 다 갚았다`,`관중이 남긴 말은 감사였다.`)]}}],original:{text:`生我者父母，知我者鮑子也。`,reading:`생아자부모, 지아자포자야.`,translation:`나를 낳은 이는 부모이지만, 나를 알아준 이는 포숙(鮑子)이다.`},related:[{word:`管理`,reading:`관리`,meaning:`일을 맡아 다스림`},{word:`血管`,reading:`혈관`,meaning:`피가 흐르는 관`},{word:`主管`,reading:`주관`,meaning:`책임지고 맡아 관리함`}],modern:`어려울 때도 서로를 믿어 준 두 사람의 관계는 관포지교에 비할 만했다.`},{id:`nonyu-01`,book:`nonyu`,idiom:`溫故知新`,reading:`온고지신`,meaning:`옛것을 익혀 새것을 앎. 지난 배움을 되새겨 새로운 이치를 깨달음.`,source:`『논어』 위정편`,heroId:`gongja`,era:`춘추시대 · 공자(기원전 551~479년)의 가르침`,scenes:[{text:`노나라의 스승 공자 곁에는 언제나 배우려는 이들이 모였다.`},{text:`공자는 스승이 될 만한 사람의 조건을 한 문장으로 말했다. 많이 아는 것만으로는 부족하다는 뜻이었다.`},{text:`그 한 문장은 오늘날까지 전한다.`,choice:{prompt:`공자의 말은?`,options:[b(`옛것을 익혀 새것을 알면 스승이 될 수 있다`,`배운 것을 되새기는 복습이 곧 새 깨달음의 길이다.`),x(`책을 많이 읽은 사람이 스승이다`,`공자는 양보다 되새김을 강조했다.`),x(`나이가 많은 사람이 스승이다`,`공자는 나이로 스승을 정하지 않았다.`)]}}],original:{text:`子曰：「溫故而知新，可以爲師矣。」`,reading:`자왈: 「온고이지신, 가이위사의.」`,translation:`공자께서 말씀하셨다. “옛것을 익혀 새것을 알면 스승이 될 수 있다.”`},related:[{word:`溫度`,reading:`온도`,meaning:`따뜻하고 찬 정도`},{word:`知識`,reading:`지식`,meaning:`배우거나 겪어서 아는 것`},{word:`新聞`,reading:`신문`,meaning:`새 소식을 전하는 간행물`}],modern:`지난 실패 보고서를 다시 읽으며 새 전략을 세우는 것, 그것이 온고지신이다.`},{id:`nonyu-02`,book:`nonyu`,idiom:`過猶不及`,reading:`과유불급`,meaning:`지나침은 미치지 못함과 같다. 알맞은 정도(중용)가 중요함.`,source:`『논어』 선진편`,heroId:`jagong`,era:`춘추시대 · 공자(기원전 551~479년)의 가르침`,scenes:[{text:`공자의 제자 자공은 말솜씨가 뛰어나고 사람을 견주어 보기를 좋아했다.`},{text:`자공이 자장(師)과 자하(商) 중 누가 더 나은지 물었다. 공자는 자장은 지나치고 자하는 미치지 못한다고 답했다.`},{text:`자공이 다시 물었다. 그렇다면 자장이 더 낫다는 말씀이냐고.`,choice:{prompt:`공자의 대답은?`,options:[b(`지나침은 미치지 못함과 같다`,`넘치는 것도 모자란 것만큼 알맞음에서 벗어난 것이다.`),x(`그렇다, 지나친 쪽이 낫다`,`공자는 어느 한쪽을 낫다고 하지 않았다.`),x(`둘 다 내 제자로 부족하다`,`공자는 두 제자를 깎아내리지 않았다.`)]}}],original:{text:`子貢問：「師與商也孰賢？」子曰：「師也過，商也不及。」曰：「然則師愈與？」子曰：「過猶不及。」`,reading:`자공문: 「사여상야숙현?」 자왈: 「사야과, 상야불급.」 왈: 「연즉사유여?」 자왈: 「과유불급.」`,translation:`자공이 “자장과 자하 중 누가 낫습니까?” 하고 묻자, 공자께서 “자장은 지나치고 자하는 미치지 못한다.” 하셨다. “그렇다면 자장이 낫습니까?” 하니 “지나침은 미치지 못함과 같다.” 하셨다.`},related:[{word:`過去`,reading:`과거`,meaning:`이미 지나간 때`},{word:`過失`,reading:`과실`,meaning:`부주의로 생긴 잘못`},{word:`普及`,reading:`보급`,meaning:`널리 퍼뜨려 미치게 함`}],modern:`운동도 과유불급이다. 무리한 훈련은 오히려 부상을 부른다.`},{id:`nonyu-03`,book:`nonyu`,idiom:`巧言令色`,reading:`교언영색`,meaning:`남의 환심 ption:`부하들이 겁쟁이라고 하자 인상여가 말했어요. “진나라가 조나라를 못 치는 건 우리 둘이 있어서다. 두 호랑이가 싸우면 둘 다 다친다.”`,svg:W(G(40,92,.65,1,`point`)+K(92,26,`나라가 먼저!`,72)+G(118,92,.55,-1)+G(140,92,.55,-1))},{caption:`이 말을 들은 염파는 가시나무를 등에 지고 찾아와 용서를 빌었어요. 두 사람은 목숨을 함께할 만큼 깊은 친구가 되었어요.`,svg:W(G(56,92,.6,1,`reach`,`#5a3a2a`)+oi(48,56)+G(104,92,.6,-1,`reach`)+Q(80,40,1.2))}],"sagi-03":[{caption:`진나라 군대가 조나라 서울을 에워쌌어요. 평원군은 초나라에 도움을 청하러 갈 사람 스무 명을 고르는데, 한 명이 모자랐어요.`,svg:W(Y(80,92,34)+X(30)+X(130)+X(50,92,.7)+X(110,92,.7)+q(80,16,`19 / 20`,M,12))},{caption:`모수가 “저를 데려가 주십시오” 하고 나섰어요. 평원군은 “재주 있는 사람은 주머니 속 송곳처럼 끝이 튀어나오는데, 3년 동안 그대 이름을 못 들었다”고 했어요.`,svg:W(G(44,92,.65,1,`up`)+K(60,20,`저요!`)+G(124,92,.65,-1,`down`,`#5a4a3a`)+ci(98,56))},{caption:`모수가 대답했어요. “그러니 오늘 저를 주머니에 넣어 주십시오. 일찍 넣어 주셨다면 손잡이까지 다 나왔을 겁니다.”`,svg:W(ci(80,52)+`<path d="M94 26 l8 -16" stroke="#8d97a3" stroke-width="5" stroke-linecap="round"/>`+$(110,12)+$(60,20)+G(36,92,.55,1,`point`))},{caption:`초나라에서 이야기가 꽉 막히자 모수가 앞으로 나가 초나라 왕을 설득했어요. 마침내 초나라가 조나라를 돕기로 했어요.`,svg:W(J(110,44,52)+G(110,92,.6,-1,`down`,`#5a4a3a`)+G(52,92,.65,1,`point`)+K(84,20,`함께 막읍시다!`,82)+`<path d="M72 80 h14" stroke="${j}" stroke-width="1.5"/>`)}],"sagi-04":[{caption:`진나라 첫 황제가 죽자, 궁궐의 관리 조고가 어린 황제를 세우고 권력을 손에 쥐었어요.`,svg:W(J(80,40,70)+G(66,92,.55,1,`down`,P)+G(98,92,.65,-1,`reach`,`#3a3a5a`)+q(98,18,`조고`,`#3a3a5a`,11))},{caption:`조고는 신하들이 자기편인지 알아보려고, 황제에게 사슴을 바치며 “말입니다”라고 했어요.`,svg:W(Zr(70)+G(118,92,.65,-1,`point`,`#3a3a5a`)+K(108,24,`말입니다`)+q(66,30,`?`,M,16))},{caption:`황제가 웃으며 신하들에게 물었어요. 조고가 무서운 신하들은 “말”이라고 했고, 바른 신하들은 “사슴”이라고 했어요.`,svg:W(G(30,92,.5)+G(52,92,.5)+K(42,30,`말!`)+G(108,92,.5,-1)+G(130,92,.5,-1)+K(118,30,`사슴!`,42))},{caption:`조고는 “사슴”이라고 바른말 한 사람들을 몰래 벌주었어요. 그 뒤로는 아무도 조고에게 맞서지 못했어요. 힘으로 거짓을 참이라고 우긴 거예요.`,svg:W(G(118,92,.65,-1,`point`,`#3a3a5a`)+G(40,92,.5,1,`down`,`#8a8070`)+G(62,92,.5,1,`down`,`#8a8070`)+`<path d="M28 30 h44" stroke="${j}" stroke-width="1.5"/>`+q(50,26,`…`,j,14))}],"sagi-05":[{caption:`한나라 장수 한신은 군사가 훨씬 많은 조나라 대군과 싸워야 했어요.`,svg:W(Array.from( 나쁜 점이 있다고 했어요.`,svg:W(G(50,92,.6,1,`up`,P)+G(110,92,.6,-1,`point`,N)+K(50,20,`그렇게나?`,60))},{caption:`“나무 위에선 물고기를 못 얻을 뿐이지만, 전쟁으로 천하를 얻으려 하면 반드시 재앙이 옵니다. 어진 정치를 하십시오.”`,svg:W(G(40,92,.6,1,`point`,N)+[86,106,126,146].map(e=>G(e,92,.45,-1,`down`,`#8a8070`)).join(``)+Q(116,34))}],"mz-04":[{caption:`“아무리 잘 자라는 식물도 하루 볕을 쬐고 열흘 춥게 두면 자랄 수 없다.”`,svg:W(`<circle cx="30" cy="26" r="9" fill="#f2c14e"/>`+[70,86,102,118,134,150].map((e,t)=>xi(e-4,24+t%2*14)).join(``)+bi(80,92,!0))},{caption:`맹자가 말했어요. “내가 왕을 만나는 날은 드물고, 내가 물러나면 왕의 마음을 차갑게 하는 사람들이 몰려온다.”`,svg:W(J(120,46,40)+G(120,92,.55,-1,`down`,P)+G(40,92,.55,1,`point`,N)+xi(80,40)+xi(96,30))},{caption:`바둑 명인 혁추가 두 사람을 가르쳤어요. 한 사람은 온 마음을 다해 들었고, 한 사람은 날아오는 고니를 쏠 생각만 했어요.`,svg:W(((e,t)=>`<rect x="62" y="70" width="36" height="20" fill="#d8b77a" stroke="${I}"/>`+[[-8,-3,j],[4,-3,`#f4f1ea`],[-2,4,j],[10,4,`#f4f1ea`]].map(([n,r,i])=>`<circle cx="${e+Number(n)}" cy="${t+Number(r)}" r="2.6" fill="${i}" stroke="${j}" stroke-width=".4"/>`).join(``))(80,80)+G(40,92,.55,1,`reach`)+G(122,92,.55,-1,`down`,`#6b5a48`)+K(132,20,`고니다…`,52))},{caption:`같이 배웠지만 두 번째 사람은 따라가지 못했어요. 머리가 나빠서가 아니라 마음을 쏟지 않았기 때문이에요.`,svg:W(G(50,92,.6,1,`up`,N)+G(114,92,.55,-1,`down`,`#6b5a48`)+$(50,24)+q(114,30,`…`,j,14))}]};function Ci(e){return Si[e]??[]}var wi={"sagi-01":{hook:`기둥 앞에서 구슬을 높이 든 인상여 — “흠 없이 돌려보낸다!”`,examples:[{where:`학교`,text:`친구에게 빌린 책을 모서리 하나 접히지 않게 돌려주었다면 완벽귀조예요.`},{where:`가정`,text:`심부름으로 받은 돈과 영수증을 하나도 빠짐없이 챙겨 온 것도 완벽귀조예요.`},{where:`사회`,text:`맡은 일을 실수 없이 끝내 놓고 결과를 깔끔하게 넘겨줄 때 “완벽하게 해냈다”고 하지요. ‘완벽(完璧)’이 바로 이 이야기에서 나온 말이에요.`}],lesson:`남의 것을 맡았을 때는 내 것보다 더 소중히 다루고, 받은 그대로 돌려주어야 믿음을 얻어요. 인상여는 힘이 센 상대 앞에서도 겁먹지 않고 꾀와 용기로 맡은 일을 끝까지 지켰어요.`,teaching:`인상여는 “성이 들어오면 구슬을 두고, 성이 들어오지 않으면 구슬을 온전히 조나라로 돌려보내겠다”고 약속하고 그대로 지켰어요. 약속을 지키는 것, 그리고 억지에 굴하지 않는 침착함이 이 고사의 핵심이에요.`,think:`내가 누군가에게 빌리거나 맡아 둔 물건·약속 중에 ‘흠 없이’ 돌려줘야 할 것은 무엇일까요?`},"sagi-02":{hook:`가시나무를 등에 진 염파와 손을 내미는 인상여 — 다툼 끝의 진짜 우정`,examples:[{where:`학교`,text:`모둠 활동에서 다툰 친구와 화해한 뒤, 서로 끝까지 믿고 돕는 사이가 되었다면 문경지교에 가까워요.`},{where:`가정`,text:`어려운 일이 생겼을 때 가장 먼저 달려와 주는 오랜 친구를 두고 문경지교라 할 수 있어요.`},{where:`사회`,text:`회사가 힘들 때 서로를 탓하지 않고 위기를 함께 넘긴 동료 사이를 문경지교라 불러요.`}],lesson:`진짜 우정은 처음부터 사이좋은 것이 아니라, 오해와 다툼을 넘어 서로를 믿게 될 때 단단해져요. 인상여는 자존심보다 나라와 함께하는 사람을 먼저 생각했고, 염파는 잘못을 깨닫자 부끄러움을 무릅쓰고 사과했어요.`,teaching:`인상여는 “두 호랑이가 싸우면 둘 다 살아남지 못한다”고 했어요. 내 감정보다 더 큰 것을 볼 줄 아는 마음, 그리고 잘못을 인정하는 용기가 함께 있어야 목숨을 나눌 만한 사귐이 된다는 가르침이에요.`,think:`다툰 뒤 더 친해진 친구가 있나요? 그때 누가 먼저, 어떻게 마음을 열었나요?`},"sagi-03":{hook:`주머니를 뚫고 나온 송곳 끝 — 숨어 있어도 드러나는 재능`,examples:[{where:`학교`,text:`평소 조용하던 친구가 발표회에서 멋진 실력을 보여 모두가 놀랐다면 낭중지추예요.`},{where:`가정`,text:`꾸준히 그림을 그려 온 동생의 솜씨를 가족들이 어느 날 알아보게 되는 것도 낭중지추예요.`},{where:`사회`,text:`신입 사원이 첫 프로젝트에서 실력을 드러내 금세 인정받을 때 낭중지추라고 해요.`}],lesson:`실력은 숨겨도 언젠가 드러나요. 하지만 모수처럼 기회가 오면 스스로 손을 들 용기도 필요해요. 준비된 사람이 나설 때 재능이 빛을 봐요.`,teaching:`평원군은 “3년 동안 이름이 들리지 않았다”며 모수를 의심했지만, 모수는 “주머니에 넣어 주기만 하면 끝뿐 아니라 손잡이까지 나올 것”이라고 답하고 결과로 보여 주었어요. 겉으로 드러난 것만 보고 사람을 판단하지 말라는 가르침도 함께 담겨 있어요.`,think:`내가 꾸준히 갈고닦고 있는 ‘송곳’은 무엇인가요? 그걸 보여 줄 기회가 오면 손을 들 수 있을까요?`,caution:`자기 자랑에 쓰기보다는 다른 사람의 뛰어난 재능을 칭찬할 때 주로 써요.`},"sagi-04":{hook:`사슴을 가리키며 “말입니다!” — 힘으로 거짓을 참이라 우기기`,examples:[{where:`학교`,text:`힘센 아이가 틀린 답을 맞다고 우기고, 다른 아이들이 무서워서 따라 말한다면 지록위마예요.`},{where:`가정`,text:`분명히 내가 깬 컵인데 “원래 금 가 있었다”고 우기며 남 탓을 한다면 지록위마와 닮았어요.`},{where:`사회`,text:`자료가 분명히 잘못을 보여 주는데도 힘 있는 사람이 “문제없다”고 우기며 사실을 뒤집을 때 지록위마라고 비판해요.`}],lesson:`거짓은 힘이 세다고 참이 되지 않아요. 무섭다고 모두가 “말”이라고 하면 바른말 하는 사람이 사라지고, 결국 모두가 피해를 입어요. 옳고 그름은 눈앞의 사실로 판단해야 해요.`,teaching:`조고는 사슴을 말이라 하며 신하들을 시험했고, 바른말 한 사람들을 몰래 해쳤어요. 사마천은 이렇게 거짓으로 권력을 휘두른 끝을 기록으로 남겨, 사실을 지키는 일의 무게를 보여 주었어요.`,think:`모두가 틀린 말에 따라가는 자리에서, 나는 어떻게 하면 용기 있게 “사슴은 사슴”이라고 말할 수 있을까요?`,caution:`단순한 착각이나 실수에는 쓰지 않아요. 알면서 힘으로 사실을 뒤집을 때 쓰는 강한 비판의 말이에요.`},"sagi-05":{hook:`강물을 등지고 선 병사들 — 물러설 곳이 없으니 온 힘을 다한다`,examples:[{where:`학교`,text:`마지막 기회라 생각하고 결승전에 온 힘을 쏟는 운동부의 각오가 배수지진이에요.`},{where:`가정`,text:`“이번에는 꼭 해낸다”고 다짐하고 미뤄 둔 일을 끝까지 해내는 마음가짐도 배수지진이에요.`},{where:`사회`,text:`회사가 마지막 투자를 걸고 모든 힘을 모아 새 제품을 내놓을 때 배수지진의 각오라고 해요.`}],lesson:`물러설 곳이 없다고 생각하면 사람은 숨은 힘까지 끌어내요. 하지만 한신이 이긴 것은 무작정 버틴 덕분만이 아니라, 숨겨 둔 기병으로 성을 차지한 계획이 있었기 때문이에요. 각오와 준비가 함께여야 해요.`,teaching:`한신은 “죽을 수밖에 없는 자리에 두어야 살길을 찾는다”는 병법을 말했어요. 남들이 “병법도 모른다”고 비웃어도, 상황을 꿰뚫어 본 판단을 믿고 밀고 나간 지혜가 담겨 있어요.`,think:`내가 ‘배수진’을 치고 꼭 해내고 싶은 일은 무엇인가요? 각오와 함께 어떤 준비를 하면 좋을까요?`,caution:`무모하게 모든 것을 거는 것을 칭찬하는 말이 아니에요. 단단한 각오로 최선을 다하는 자세를 말할 때 써요.`},"sagi-06":{hook:`깊은 밤 사방에서 들려오는 초나라 노래 — 둘러봐도 내 편이 없다`,examples:[{where:`학교`,text:`숙제는 밀렸는데 시험까지 겹치고 도와줄 친구도 없어 막막하다면 사면초가에 빠진 거예요.`},{where:`가정`,text:`여러 가지 문제가 한꺼번에 몰려와 어디서부터 풀어야 할지 모르는 처지를 사면초가라고 해요.`},{where:`사회`,text:`재료 값은 오르고 손님은 줄어 사방이 막힌 가게나 회사의 처지를 사면초가라고 해요.`}],lesson:`사면초가는 갑자기 오지 않아요. 항우는 힘이 셌지만 사람들의 마음을 얻지 못해 하나둘 곁을 잃었어요. 평소에 믿을 만한 사람을 얻고, 혼자 다 하려 하지 않는 것이 고립을 막는 길이에요.`,teaching:`항우는 사방의 초나라 노래를 듣고 “한나라가 초나라를 다 얻었는가” 하고 놀랐어요. 적진에서 고향 노래가 들리자, 항우는 초나라 사람들마저 적의 편이 되었다고 여겨 크게 낙심했어요. 사마천은 힘만 믿은 영웅의 끝을 보여 주어 사람의 마음을 얻는 일의 중요성을 일깨워요.`,think:`내가 막막할 때 손을 내밀어 줄 사람은 누구인가요? 나는 누구에게 그런 사람이 되어 주고 있나요?`},"sagi-07":{hook:`토끼를 잡고 나니 솥 앞에 선 사냥개 — 쓸모가 다하면 버린다`,examples:[{where:`학교`,text:`조별 과제 때만 친한 척하다가 과제가 끝나자 모른 척하는 행동은 토사구팽과 닮았어요.`},{where:`가정`,text:`필요할 때만 친구를 찾고 볼일이 끝나면 연락을 끊는다면 친구는 토사구팽당했다고 느낄 거예요.`},{where:`사회`,text:`큰일을 끝내자마자 그 일을 해낸 사람을 내보내는 회사를 두고 토사구팽이라고 비판해요.`}],lesson:`사람을 ‘쓸모’로만 보면 결국 아무도 곁에 남지 않아요. 함께 고생한 사람을 끝까지 소중히 여기는 것이 믿음을 지키는 길이에요. 또 범려처럼 상대의 마음을 잘 살펴, 물러설 때를 아는 지혜도 필요해요.`,teaching:`범려는 “새를 다 잡으면 좋은 활은 거두어 두고, 토끼가 죽으면 사냥개를 삶는다”고 경고했어요. 어려울 때는 함께해도 기쁨은 함께하지 못하는 사람을 알아보라는 말이었어요. 경고를 듣지 않은 문종의 비극은 권력의 차가움을 보여 줘요.`,think:`나는 친구를 ‘필요할 때만’ 찾고 있지는 않나요? 고마운 사람에게 고마움을 표현한 적이 언제였나요?`,caution:`버리는 쪽을 비판하는 말이에요. 자기가 억울하게 버림받았을 때 “토사구팽당했다”처럼 써요.`},"sagi-08":{hook:`이익을 더 가져가는 관중을 웃으며 바라보는 포숙아 — 나를 알아주는 벗`,examples:[{where:`학교`,text:`내가 실수해도 “사정이 있었겠지” 하고 먼저 믿어 주는 친구와의 사이가 관포지교예요.`},{where:`가정`,text:`어린 시절부터 서로의 형편과 마음을 잘 알아 늘 편이 되어 주는 부모님의 오랜 친구 사이도 관포지교예요.`},{where:`사회`,text:`동료가 좋은 자리에 오르도록 자기 대신 추천해 주는 사람과 그 동료의 관계를 관포지교라고 할 수 있어요.`}],lesson:`좋은 친구는 겉으로 보이는 잘못보다 그 뒤의 사정을 먼저 헤아려 줘요. 포숙아는 관중의 가난, 늙은 어머니, 때를 못 만난 처지를 이해했고, 나중에는 자기보다 관중을 더 높은 자리에 추천했어요.`,teaching:`관중은 “나를 낳은 이는 부모요, 나를 알아준 이는 포숙아”라고 했어요. 상대를 깊이 이해하고 그 가능성을 믿어 주는 것, 그것이 사람을 크게 키우는 우정이라는 가르침이에요.`,think:`나를 ‘알아주는’ 친구는 누구인가요? 나는 친구의 사정을 먼저 헤아려 준 적이 있나요?`},"nonyu-01":{hook:`오래된 책을 다시 펼치자 켜지는 전구 — 옛것에서 새것이 나온다`,examples:[{where:`학교`,text:`지난 시험에서 틀린 문제를 다시 풀다가 새로운 풀이법을 깨달았다면 온고지신이에요.`},{where:`가정`,text:`할머니의 옛 요리법을 배워 우리 집만의 새 요리를 만들어 보는 것도 온고지신이에요.`},{where:`사회`,text:`전통 한옥의 지혜를 살려 에너지를 아끼는 새 건물을 짓는 것을 온고지신이라고 해요.`}],lesson:`배움은 한 번으로 끝나지 않아요. 배운 것을 다시 익히고 곰곰이 생각하면, 처음에는 보이지 않던 새로운 이치가 보여요. 복습은 같은 것을 되풀이하는 일이 아니라 새로운 것을 발견하는 일이에요.`,teaching:`공자는 “옛것을 익혀 새것을 알면 스승이 될 수 있다”고 했어요. 많이 외우는 것보다, 아는 것에서 새로운 생각을 끌어낼 수 있어야 남을 가르칠 수 있다는 뜻이에요.`,think:`오늘 배운 것 중에 내일 다시 꺼내 보고 싶은 것은 무엇인가요? 다시 보면 무엇이 새로 보일까요?`},"nonyu-02":{hook:`넘치는 잔, 모자란 잔, 알맞은 잔 — 넘쳐도 모자라도 안 된다`,examples:[{where:`학교`,text:`시험 전날 밤을 새워 공부했다가 너무 졸려서 시험을 망쳤다면 과유불급이에요.`},{where:`가정`,text:`몸에 좋다고 한 가지 음식만 너무 많이 먹으면 오히려 탈이 나요. 과유불급이에요.`},{where:`사회`,text:`실력을 키운다며 무리하게 훈련하다 다치는 운동선수에게 과유불급이라고 말해요.`}],lesson:`좋은 것도 지나치면 모자란 것만 못할 수 있어요. 공부, 운동, 게임, 칭찬까지도 알맞은 정도가 있어요. 내게 맞는 ‘알맞음’을 찾는 것이 꾸준히 잘하는 비결이에요.`,teaching:`자공은 “지나친 자장이 더 낫지 않느냐”고 물었지만, 공자는 “지나침은 모자람과 같다”고 답했어요. 한쪽으로 치우치지 않는 ‘중용(中庸)’, 곧 알맞음을 지키라는 가르침이에요.`,think:`요즘 내가 ‘너무 많이’ 하거나 ‘너무 적게’ 하는 일은 무엇인가요? 알맞은 정도는 얼마일까요?`,caution:`“아예 하지 말라”는 뜻이 아니에요. 지나치지도 모자라지도 않게 알맞게 하라는 뜻이에요.`},"nonyu-03":{hook:`반짝이는 말풍선 뒤에 숨은 빈 마음 — 꾸민 말보다 진심`,examples:[{where:`학교`,text:`선생님 앞에서만 칭찬을 늘어놓고 뒤에서는 친구를 흉보는 행동은 교언영색이에요.`},{where:`가정`,text:`용돈을 받으려고 갑자기 듣기 좋은 말만 하는 것도 교언영색과 닮았어요.`},{where:`사회`,text:`물건을 팔려고 좋은 점만 과장하고 단점은 숨기는 말솜씨를 교언영색이라고 경계해요.`}],lesson:`듣기 좋은 말보다 그 말에 진심이 담겼는지가 중요해요. 말을 잘하는 것은 좋은 재주지만, 말과 행동이 같을 때 믿음을 얻어요. 달콤한 말만 하는 사람은 한 번 더 살펴보는 지혜도 필요해요.`,teaching:`공자는 “말을 교묘하게 꾸미고 얼굴빛을 좋게 꾸미는 사람 중에 어진 이는 드물다”고 했어요. 반대로 꾸밈없이 소박하고 말이 서툴러도 굳센 사람이 어진 마음(仁)에 가깝다고 보았어요.`,think:`내가 한 말 중에 마음과 다르게 꾸며서 한 말이 있었나요? 진심을 전하려면 어떻게 말하면 좋을까요?`,caution:`친절하고 예의 바른 말까지 나쁘다는 뜻은 아니에요. 진심 없이 환심을 사려고 꾸민 말과 표정을 가리킬 때 써요.`},"nonyu-04":{hook:`작은 새싹이 큰 나무를 넘어선다 — 뒤에 오는 사람을 얕보지 말 것`,examples:[{where:`학교`,text:`선배들이 어리다고 무시하던 후배가 대회에서 상을 받자 모두가 “후생가외”라며 놀랐어요.`},{where:`가정`,text:`어린 동생이 어느새 나보다 더 잘하게 된 것을 보고 후생가외를 느낄 수 있어요.`},{where:`사회`,text:`젊은 연구자가 새로운 생각으로 오래된 문제를 풀어낼 때 선배 학자들이 후생가외라고 말해요.`}],lesson:`나이가 어리다고, 지금 서툴다고 사람을 얕보면 안 돼요. 누구나 배우며 자라 언젠가 앞사람을 넘어설 수 있어요. 그리고 나 역시 ‘뒤에 오는 사람’으로서 꾸준히 노력하면 큰 사람이 될 수 있어요.`,teaching:`공자는 “뒤에 오는 사람이 지금 사람만 못하리라고 어찌 알겠는가”라고 했어요. 그러면서도 “마흔, 쉰이 되도록 이름이 알려지지 않으면 두려워할 것이 없다”고 덧붙였어요. 가능성은 존중하되, 그 가능성은 꾸준한 노력으로만 열매 맺는다는 가르침이에요.`,think:`내가 얕보았던 사람 중에 사실 배울 점이 많은 사람은 없었나요? 나는 어떤 ‘새싹’을 키우고 있나요?`,caution:`‘두려워할 만하다(畏)’는 무서워하라는 뜻이 아니라, 존중하고 경계하며 귀하게 여기라는 뜻이에요.`},"mj-01":{hook:`깃발을 먼저 든 사람이 판을 이끈다 — 먼저 하면 남을 누른다`,examples:[{where:`학교`,text:`모둠 과제가 나오자마자 역할을 먼저 나누고 계획을 세운 모둠이 여유 있게 끝냈다면 선즉제인이에요.`},{where:`가정`,text:`시험 일정을 미리 확인하고 먼저 계획표를 짠 형은 막판에 허둥대지 않았어요. 선즉제인이에요.`},{where:`사회`,text:`다른 회사보다 한발 먼저 새 서비스를 내놓아 손님을 모은 회사를 두고 선즉제인이라고 해요.`}],lesson:`기회는 기다리는 사람보다 먼저 준비하고 움직이는 사람에게 와요. 다만 ‘먼저’가 ‘서두름’은 아니에요. 항량은 오래전부터 병법을 익히고 사람들을 모아 두었기에 때가 오자 바로 움직일 수 있었어요.`,teaching:`이 말은 은통이 했지만, 정작 그 말을 실천한 사람은 항량이었어요. 같은 말을 들어도 준비된 사람이 먼저 움직여 기회를 잡는다는 것, 그리고 남의 계획에 끌려가지 말고 스스로 판을 이끌라는 것이 이 고사의 가르침이에요.`,think:`내가 늘 ‘나중에’ 하다가 놓친 일은 무엇인가요? 이번 주에 먼저 시작할 일 하나를 정해 볼까요?`,caution:`남을 속이거나 해치려고 먼저 손쓰는 일을 칭찬하는 말이 아니에요. 앞서 준비해 주도권을 잡는다는 뜻으로 써요.`},"mj-02":{hook:`가라앉는 배와 깨진 솥 — 돌아갈 길을 내가 끊는다`,examples:[{where:`학교`,text:`“이번 대회가 마지막”이라며 게임도 끊고 연습에만 매달린 운동부의 마음가짐이 파부침주예요.`},{where:`가정`,text:`다이어트를 결심하고 집에 있던 과자를 모두 나눠 준 것도 돌아갈 길을 끊는 파부침주예요.`},{where:`사회`,text:`회사가 하던 사업을 정리하고 새 분야에 모든 것을 건 결정을 파부침주라고 해요.`}],lesson:`사람은 물러설 길이 있으면 자꾸 그쪽을 돌아보게 돼요. 스스로 핑계와 퇴로를 없애면 온 힘을 한곳에 모을 수 있어요. 하지만 항우가 이긴 것은 각오만이 아니라, 머뭇거리던 군대를 직접 이끌고 빠르게 강을 건넌 결단력 덕분이기도 했어요.`,teaching:`항우는 배와 솥과 막사를 없애 “반드시 죽기로 싸우고 돌아갈 마음은 하나도 없다”는 뜻을 병사들에게 보여 주었어요. 지도자가 말이 아니라 행동으로 각오를 보여 줄 때 사람들이 한마음이 된다는 가르침이에요. 앞서 배운 배수지진(한신)과 비교해 보면 좋아요.`,think:`배수지진과 파부침주는 어떻게 닮았고 어떻게 다를까요? (힌트: 누가, 어디서, 무엇을 없앴나요?)`,caution:`되돌릴 수 없는 큰 결정에 쓰는 말이에요. 작은 일에 무리하게 모든 것을 걸라는 뜻은 아니에요.`},"mj-03":{hook:`웃음 가득한 잔치, 그 한가운데서 춤추는 칼 — 겉과 속이 다른 자리`,examples:[{where:`학교`,text:`친한 척 불러 놓고 다른 친구들 앞에서 망신을 주려는 자리였다면 홍문지연 같은 자리예요.`},{where:`가정`,text:`“맛있는 거 사 줄게” 하고 불러내서는 사실 곤란한 부탁을 하려던 자리도 작은 홍문지연이에요.`},{where:`사회`,text:`겉으로는 화해를 위한 만남이지만 실제로는 상대를 무너뜨리려는 협상 자리를 홍문지연이라고 해요.`}],lesson:`위험은 늘 무섭게 다가오지 않아요. 때로는 웃음과 대접 속에 숨어 있어요. 유방이 살아남은 것은 겸손하게 사과하고, 장량이 상황을 재빨리 알아차리고, 번쾌가 용기 있게 나섰기 때문이에요. 눈치, 침착함, 그리고 나를 지켜 주는 동료가 모두 필요했어요.`,teaching:`장량은 “항장이 칼춤을 추는데, 그 뜻은 줄곧 패공에게 있다”고 했어요. 여기서 ‘항장무검 의재패공(項莊舞劍 意在沛公)’, 곧 겉으로 하는 행동 뒤에 진짜 목적이 숨어 있다는 말도 생겼어요. 또 범증의 신호를 무시한 항우의 머뭇거림이 훗날 큰 후회로 돌아왔다는 점도 기억할 만해요.`,think:`누군가 지나치게 잘해 줄 때, 그 뒤에 숨은 뜻을 어떻게 알아볼 수 있을까요? 반대로 나는 친구에게 숨은 뜻 없이 솔직하게 대하고 있나요?`},"mj-04":{hook:`도망친 한 사람을 쫓아 달려간 승상 — 나라에 둘도 없는 인재`,examples:[{where:`학교`,text:`전학 가려는 친구를 선생님이 꼭 붙잡으며 “우리 반에 꼭 필요한 친구”라고 했다면 국사무쌍으로 본 거예요.`},{where:`가정`,text:`어떤 일이든 척척 해결하는 할머니를 두고 가족들이 “우리 집 국사무쌍”이라고 부를 수 있어요.`},{where:`사회`,text:`회사가 다른 곳으로 가려던 핵심 기술자를 끝까지 설득해 붙잡았다면 그 사람을 국사무쌍으로 본 거예요.`}],lesson:`인재는 스스로 빛나기도 하지만, 알아보고 붙잡아 주는 사람이 있어야 크게 쓰여요. 소하는 낮은 자리의 한신을 알아보고, 왕에게 알릴 틈도 없이 직접 쫓아가 데려왔어요. 사람을 알아보는 눈과 그 사람을 위해 움직이는 용기가 함께 있었어요.`,teaching:`소하는 “여러 장수는 얻기 쉽지만 한신 같은 사람은 나라에 둘도 없다”고 했어요. 유방은 그 말을 믿고 한신을 대장군으로 삼았고, 한신은 배수진 등으로 큰 공을 세웠어요. 남이 알아주지 않을 때에도 실력을 갈고닦은 한신, 그리고 그 실력을 알아본 소하에게서 낭중지추·관포지교와 이어지는 가르침을 얻을 수 있어요.`,think:`내 주변에서 남들이 몰라보지만 사실 뛰어난 사람은 누구인가요? 그 사람의 장점을 오늘 한 번 말해 줄 수 있을까요?`,caution:`‘국사(國士)’는 나라에서 손꼽히는 선비·인재를 뜻해요. 아무에게나 쓰기보다 정말 뛰어나고 꼭 필요한 사람을 높여 말할 때 써요.`},"cs-01":{hook:`작은 닭의 부리 vs 큰 소의 꼬리 — 어디서든 내 목소리를 내는 자리`,examples:[{where:`학교`,text:`큰 동아리에서 구경만 하기보다 작은 동아리를 직접 만들어 이끄는 친구는 계구우후를 택한 거예요.`},{where:`가정`,text:`형 뒤를 따라다니기보다 내가 잘하는 요리를 맡아 가족 식사를 책임지는 것도 작은 계구우후예요.`},{where:`사회`,text:`큰 회사의 말단 대신 작은 회사를 차려 대표가 된 사람에게 계구우후라고 해요.`}],lesson:`크고 화려한 곳에 속하는 것보다, 작아도 스스로 결정하고 책임지는 자리가 더 값질 때가 있어요. 한나라 왕은 강대국의 꼬리가 되는 대신 스스로 서는 길을 택했어요. 남에게 끌려가지 않는 자존심이 나라를 지키는 힘이 되기도 해요.`,teaching:`소진은 이 속담 하나로 한나라 왕의 마음을 움직였어요. 상대의 자존심과 두려움을 함께 읽고, 짧은 비유로 설득한 것이 소진의 힘이었어요. 여섯 나라가 손잡는 ‘합종’이 이렇게 이루어졌지만, 뒤에 장의가 나라마다 진나라와 따로 손잡게 하는 ‘연횡’을 펼치면서 합종은 무너졌어요.`,think:`나는 큰 무리의 꼬리와 작은 무리의 머리 중 어느 쪽이 더 나에게 맞을까요? 그렇게 생각한 이유는 무엇인가요?`,caution:`무조건 작은 곳이 좋다는 말이 아니에요. 남에게 끌려다니지 말고 스스로 설 수 있는 자리를 고르라는 뜻이에요.`},"cs-02":{hook:`“저부터 쓰십시오” — 큰 변화는 가까운 곳, 나부터`,examples:[{where:`학교`,text:`교실을 깨끗하게 하자고 말하기 전에 내 책상부터 정리하는 것이 선종외시예요.`},{where:`가정`,text:`“가족 모두 휴대폰을 줄이자”며 아빠가 먼저 저녁 시간에 휴대폰을 내려놓았다면 선종외시예요.`},{where:`사회`,text:`좋은 인재를 모으고 싶은 회사가 지금 있는 직원부터 제대로 대우하는 것을 선종외시라고 해요.`}],lesson:`큰일은 먼 곳에서 시작되지 않아요. 곽외는 “멀리서 찾기 전에 가까이 있는 사람부터 제대로 대접하라”고 했어요. 작은 본보기 하나가 소문이 되어 더 큰 사람들을 불러와요. 변화를 원한다면 내가 먼저, 지금 할 수 있는 일부터 하는 것이 시작이에요.`,teaching:`연나라 소왕은 곽외의 말대로 그를 스승으로 모셨고, 그 소문을 듣고 악의·추연·극신 같은 인재가 연나라로 모였어요. 뒷날 악의는 제나라를 크게 무찔러 소왕의 오랜 소원을 이루었어요. 지도자가 몸을 낮추고 사람을 귀하게 여길 때 나라가 일어선다는 가르침이에요.`,think:`내가 바꾸고 싶은 것 하나를 떠올려 보세요. 그걸 위해 오늘 ‘나부터’ 할 수 있는 작은 일은 무엇일까요?`},"cs-03":{hook:`꼬끼오! 한밤중 관문을 연 닭 울음 흉내 — 하찮은 재주는 없다`,examples:[{where:`학교`,text:`모두 쓸모없다던 친구의 성대모사가 장기자랑에서 반을 우승으로 이끌었다면 계명구도예요.`},{where:`가정`,text:`늘 장난감만 고치던 동생이 고장 난 선풍기를 뚝딱 고쳤다면, 하찮아 보이던 재주가 빛난 거예요.`},{where:`사회`,text:`평소 눈에 띄지 않던 직원의 특별한 재주가 위기 때 회사를 구하는 경우를 계명구도에 빗대요.`}],lesson:`맹상군은 남들이 비웃던 재주꾼들도 식객으로 받아 주었고, 바로 그 사람들이 목숨을 구해 주었어요. 사람의 재주에는 높고 낮음이 없고, 쓰일 때가 따로 있을 뿐이에요. 다른 사람의 작은 재주를 무시하지 말고, 나의 작은 재주도 소중히 갈고닦아요.`,teaching:`처음에는 다른 식객들이 이 두 사람과 같이 대접받는 것을 부끄러워했지만, 맹상군이 위기를 넘긴 뒤로는 모두 탄복했어요. 다만 뒷날 사람들은 이 말을 ‘잔재주만 부리는 사람’이라는 낮잡는 뜻으로도 썼어요. 같은 이야기에도 두 가지 뜻이 담겨 있다는 것을 기억해요.`,think:`친구의 재주 중에 내가 하찮게 여겼던 것은 없나요? 나만의 작은 재주는 무엇이고, 어디에 쓸 수 있을까요?`,caution:`칭찬(작은 재주도 쓸모가 있다)과 낮잡음(잔재주만 부리는 사람) 두 가지로 쓰여요. 남을 부를 때는 낮잡는 뜻으로 들릴 수 있으니 조심해요.`},"cs-04":{hook:`모두가 지나친 볼모 왕손에게서 보물을 본 상인 — 기회를 알아보는 눈`,examples:[{where:`학교`,text:`아무도 관심 없던 과학 동아리에 들어가 열심히 해서 대회 상을 받은 친구는 기화가거를 실천한 거예요.`},{where:`가정`,text:`버려질 뻔한 오래된 책상을 고쳐 멋진 공부상으로 만든 할아버지는 남들이 못 본 가치를 알아본 거예요.`},{where:`사회`,text:`아무도 주목하지 않던 신인 작가의 가능성을 알아보고 먼저 계약한 출판사를 기화가거에 빗대요.`}],lesson:`좋은 기회는 처음엔 초라해 보일 때가 많아요. 여불위는 모두가 무시하던 볼모 왕손에게서 큰 가능성을 보았고, 과감히 투자했어요. 남들과 다른 눈으로 가치를 알아보고 때를 놓치지 않는 것이 큰일을 만드는 힘이에요.`,teaching:`여불위는 이 판단으로 진나라의 승상이 되었지만, 사람을 ‘사 둘 물건’처럼 계산한 끝은 좋지 않았어요. 뒷날 권력 다툼 속에서 결국 몰락했지요. 기회를 알아보는 눈은 배우되, 사람을 이익의 도구로만 보아서는 안 된다는 것도 함께 기억해요.`,think:`지금은 작아 보이지만 나중에 크게 자랄 ‘기회’는 무엇일까요? 그 기회를 잡으려면 무엇을 준비해야 할까요?`,caution:`사람을 물건처럼 계산하라는 뜻이 아니에요. 좋은 기회를 알아보고 놓치지 말라는 뜻으로 써요.`},"uh-01":{hook:`호랑이 앞을 걷는 여우 — 짐승들이 무서워한 건 여우가 아니었다`,examples:[{where:`학교`,text:`선생님 심부름을 한다며 친구들에게 이것저것 시키며 으스대는 것은 호가호위예요.`},{where:`가정`,text:`“엄마가 그랬어!” 하며 엄마 말을 핑계로 동생에게 큰소리치는 형은 호가호위를 한 셈이에요.`},{where:`사회`,text:`높은 사람과 가깝다는 것을 내세워 다른 직원들에게 함부로 하는 사람을 호가호위한다고 해요.`}],lesson:`남의 힘을 빌려 얻은 위세는 내 것이 아니에요. 호랑이가 떠나면 여우는 다시 작은 여우일 뿐이지요. 진짜 존경은 빌린 힘이 아니라 내 실력과 행동에서 나와요. 그리고 누군가 큰소리를 칠 때, 그 힘이 정말 그 사람의 것인지 살펴보는 눈도 필요해요.`,teaching:`강을은 이 이야기로 초나라 선왕에게 “북쪽 나라들이 두려워하는 것은 재상 소해휼이 아니라 그에게 맡기신 왕의 백만 군대”라고 깨우쳐 주었어요. 왕이 신하를 무조건 믿지 말고, 그 신하가 누구의 힘으로 위세를 부리는지 살피라는 가르침이에요.`,think:`내가 다른 사람의 힘을 빌려 으스댄 적은 없나요? 반대로 그런 사람을 만나면 어떻게 대하면 좋을까요?`,caution:`남을 탓하거나 놀리는 말로 쓰이기 쉬워요. 친구에게 직접 “너 호가호위하네” 하기보다 상황을 설명할 때 써요.`},"uh-02":{hook:`뱀에게 발을 그려 준 사람 — 다 끝난 일에 덧붙이다 모두 잃었다`,examples:[{where:`학교`,text:`정답을 잘 써 놓고 괜히 한 줄을 덧붙였다가 틀린 답이 된 것은 화사첨족이에요.`},{where:`가정`,text:`맛있게 끓인 찌개에 이것저것 더 넣다가 맛을 망친 아빠의 요리는 화사첨족이었어요.`},{where:`사회`,text:`이미 충분한 제품에 쓸데없는 기능을 잔뜩 더해 쓰기 어렵게 만든 것을 화사첨족이라고 해요.`}],lesson:`잘하려는 욕심이 지나치면 이미 이룬 것까지 망칠 수 있어요. 일을 마쳤으면 멈출 줄 아는 것도 실력이에요. 더할 것이 정말 필요한지, 아니면 자랑하고 싶은 마음 때문인지 한 번 더 생각해 봐요.`,teaching:`진진은 이 이야기로 초나라 장군 소양을 설득했어요. “장군은 이미 큰 공을 세워 더 오를 벼슬도 없는데, 제나라와 싸우다 지면 그 공마저 잃습니다.” 소양은 그 말을 옳다고 여겨 군대를 거두었어요. 이긴 뒤에 멈출 때를 아는 지혜를 알려 주는 이야기예요.`,think:`이미 잘된 일에 괜히 무언가를 더하다 망친 경험이 있나요? 다음에는 언제 멈추면 좋을까요?`,caution:`새로운 시도를 하지 말라는 뜻이 아니에요. 필요 없는 것을 덧붙여 일을 그르치지 말라는 뜻으로 써요.`},"uh-03":{hook:`조개와 도요새가 버티는 사이 — 웃은 사람은 지나가던 어부`,examples:[{where:`학교`,text:`두 친구가 맨 앞자리를 두고 다투는 사이 다른 친구가 그 자리에 앉았다면 어부지리예요.`},{where:`가정`,text:`형과 누나가 마지막 과자를 두고 싸우는 동안 막내가 과자를 먹어 버렸다면 어부지리예요.`},{where:`사회`,text:`두 회사가 지나친 가격 경쟁으로 힘이 빠진 사이 새 회사가 손님을 모두 얻는 것을 어부지리라고 해요.`}],lesson:`서로 지지 않으려고 끝까지 버티면 둘 다 잃을 수 있어요. 다툼이 길어질수록 이익을 보는 것은 엉뚱한 사람이에요. 고집을 꺾고 한 발 물러서는 것이 결국 나를 지키는 길이 될 때가 많아요.`,teaching:`소대는 연나라를 지키려고 이 이야기를 조나라 혜문왕에게 들려주었어요. 조나라와 연나라가 오래 싸우면 두 나라 모두 지치고, 강한 진나라가 어부처럼 둘을 함께 삼킬 것이라고요. 혜문왕은 그 말을 받아들여 전쟁을 멈추었어요. 큰 그림을 보고 다툼을 멈추는 지혜를 알려 줘요.`,think:`지금 누군가와 지지 않으려고 버티고 있는 일이 있나요? 그 다툼이 길어지면 누가 이익을 볼까요?`},"uh-04":{hook:`아흔 살 노인이 산을 옮기기 시작했다 — 꾸준함은 산도 움직인다`,examples:[{where:`학교`,text:`하루 단어 다섯 개씩 일 년을 외워 영어 책을 술술 읽게 된 친구는 우공이산을 보여 주었어요.`},{where:`가정`,text:`할머니가 날마다 한 줄씩 떠서 겨울 동안 온 가족의 목도리를 완성하셨다면 우공이산이에요.`},{where:`사회`,text:`마을 사람들이 몇 년 동안 날마다 나무를 심어 민둥산을 숲으로 바꾼 일을 우공이산이라고 해요.`}],lesson:`아무리 큰일도 작은 걸음을 쌓으면 이룰 수 있어요. 남들이 어리석다고 비웃어도 꾸준히 하는 사람이 결국 큰일을 해내요. 오늘 할 수 있는 작은 한 걸음을 멈추지 않는 것, 그것이 산을 옮기는 힘이에요.`,teaching:`지수는 똑똑해 보였지만 지금 당장의 힘만 계산했어요. 우공은 자신과 자손이 대를 이어 해 나갈 시간을 내다보았지요. 하늘의 임금이 감동해 산을 옮겨 준 것은 그 끈기 때문이었어요. 함께 마음을 모으고 오래 이어 가는 노력이 가장 큰 힘이라는 가르침이에요.`,think:`너무 커 보여서 시작도 못 한 목표가 있나요? 그 목표를 위해 날마다 할 수 있는 작은 일은 무엇일까요?`,caution:`무조건 버티라는 뜻이 아니에요. 옳은 목표를 정했다면 포기하지 말고 꾸준히 하라는 뜻으로 써요.`},"hb-01":{hook:`그루터기 옆에서 토끼만 기다린 농부 — 행운은 두 번 오지 않는다`,examples:[{where:`학교`,text:`지난번 시험에서 찍은 답이 맞았다고 이번에도 공부 없이 찍기만 믿는 것은 수주대토예요.`},{where:`가정`,text:`한 번 용돈을 크게 받았다고 날마다 그날만 기다리며 아무것도 안 하는 것도 수주대토예요.`},{where:`사회`,text:`예전에 잘 팔리던 방식만 고집하다 손님이 떠난 가게를 두고 수주대토라고 해요.`}],lesson:`한 번 우연히 잘된 일이 앞으로도 계속되리라 믿으면 안 돼요. 농부는 토끼를 기다리는 동안 밭을 버려 진짜 수확까지 잃었어요. 행운은 기다리는 것이 아니라 땀으로 만드는 것이에요. 그리고 상황이 바뀌면 나의 방법도 바꿀 줄 알아야 해요.`,teaching:`한비는 이 이야기를 하며 “옛 임금의 방식으로 오늘의 백성을 다스리려는 것은 모두 그루터기를 지키는 무리”라고 했어요. 시대가 바뀌면 일하는 방법도 바뀌어야 한다는 뜻이에요. 지난 성공에 머물지 말고, 지금에 맞는 새로운 길을 찾으라는 가르침이에요.`,think:`예전에 잘됐던 방법을 아무 생각 없이 계속하고 있는 일은 없나요? 지금 상황에 맞게 바꿔 볼 점은 무엇일까요?`},"hb-02":{hook:`삼백 명 속에 숨은 가짜 악사 — 혼자 부는 날 들통났다`,examples:[{where:`학교`,text:`모둠 과제에서 이름만 올리고 아무 일도 안 하다가 혼자 발표하는 날 당황하는 것은 남우충수예요.`},{where:`가정`,text:`설거지를 “같이 했다”고 하면서 옆에서 구경만 한 동생은 남우충수를 한 셈이에요.`},{where:`사회`,text:`실력은 없이 좋은 자리만 차지하고 있다가 혼자 맡은 일에서 바닥이 드러나는 것을 남우충수라고 해요.`}],lesson:`여럿 속에 숨으면 잠깐은 들키지 않을 수 있어요. 하지만 혼자 해야 하는 순간은 반드시 찾아와요. 그때 드러나는 것이 진짜 내 실력이에요. 남 몰래 하는 척하기보다, 조금 서툴러도 진짜로 배우고 연습하는 것이 결국 나를 지켜 줘요.`,teaching:`한비는 왕이 신하들의 말을 한꺼번에 듣지 말고 하나하나 따로 들어 보아야 누가 진짜로 일을 하는지 가려낼 수 있다고 했어요. 민왕이 한 사람씩 연주를 들은 것처럼요. 일을 맡길 때는 실력을 제대로 살피고, 맡은 사람은 자기 몫을 정직하게 해내야 한다는 가르침이에요.`,think:`여럿이 하는 일에서 나는 내 몫을 제대로 하고 있나요? 혼자 해도 자신 있는 일은 무엇인가요?`,caution:`남을 깎아내리는 말이 될 수 있어요. 스스로를 돌아볼 때나 상황을 설명할 때 써요.`},"hb-03":{hook:`시장에 호랑이가 나타났다고? 세 번 들으면 믿게 되는 소문의 힘`,examples:[{where:`학교`,text:`“쟤가 그랬대” 하는 말을 여러 친구에게 듣고 확인도 없이 믿어 버리는 것은 삼인성호예요.`},{where:`가정`,text:`여러 사람이 퍼뜨린 건강 정보를 확인 없이 믿고 따라 하는 것도 삼인성호의 함정이에요.`},{where:`사회`,text:`인터넷에 같은 가짜 뉴스가 여러 번 올라오자 많은 사람이 사실로 믿은 일을 삼인성호라고 해요.`}],lesson:`같은 말을 여러 번 들으면 거짓도 참처럼 느껴져요. 그래서 많은 사람이 말한다고 해서 그대로 믿기보다, 직접 확인하고 근거를 찾아보는 습관이 필요해요. 그리고 나도 확인하지 않은 말을 옮기는 ‘세 번째 사람’이 되지 않도록 조심해요.`,teaching:`방공은 자기가 떠난 뒤 헐뜯는 말이 쏟아질 것을 알고 미리 왕에게 부탁했어요. 그런데도 왕은 결국 그 말들을 믿어 방공을 다시 만나 주지 않았어요. 미리 알고 있어도 소문에 휩쓸리기 쉽다는 것, 그래서 윗사람일수록 말을 가려 들어야 한다는 가르침이에요.`,think:`최근에 들은 소문이나 정보 중에 직접 확인하지 않고 믿은 것은 없나요? 어떻게 확인할 수 있을까요?`},"hb-04":{hook:`길 잃은 군대를 집으로 데려간 늙은 말 — 경험도 지혜다`,examples:[{where:`학교`,text:`처음 하는 실험이 막히자 작년에 해 본 선배에게 방법을 물어 해결했다면 노마지지예요.`},{where:`가정`,text:`김치 맛이 이상할 때 오래 담가 오신 할머니께 비결을 여쭙는 것은 노마지지를 빌리는 일이에요.`},{where:`사회`,text:`새 기계가 고장 나자 오래 일한 기술자의 경험으로 금세 원인을 찾은 것을 노마지지라고 해요.`}],lesson:`힘세고 빠른 것만이 능력은 아니에요. 오래 겪어 본 경험은 그 자체로 큰 지혜예요. 모르는 것이 있을 때 부끄러워하지 말고, 나보다 먼저 겪어 본 사람에게 묻고 배우는 것이 길을 찾는 가장 빠른 방법이에요.`,teaching:`관중과 습붕은 나라에서 가장 지혜로운 신하였지만, 길을 잃자 늙은 말에게 배우고 물이 없자 개미에게 배웠어요. 한비는 “이렇게 지혜로운 사람도 말과 개미에게 배우는데, 지금 사람들은 어리석으면서도 성인의 지혜를 배울 줄 모른다”라고 꾸짖었어요. 배움에는 높고 낮음이 없다는 가르침이에요.`,think:`내 주변에서 나보다 경험이 많은 사람은 누구인가요? 그분께 배우고 싶은 것은 무엇인가요?`},"sg-01":{hook:`세 번 찾아가서야 만난 사람 — 정성은 마음을 움직인다`,examples:[{where:`학교`,text:`전학 온 친구에게 같이 놀자고 몇 번이고 다가가 결국 단짝이 되었다면 삼고초려예요.`},{where:`가정`,text:`바쁜 할아버지께 옛이야기를 들려 달라고 몇 번이나 정중히 부탁드린 것도 삼고초려예요.`},{where:`사회`,text:`꼭 필요한 전문가를 모시려고 회사 대표가 직접 여러 번 찾아가 설득하는 것을 삼고초려라고 해요.`}],lesson:`정말 소중한 것을 얻으려면 한 번 거절당했다고 포기하지 말고, 정성을 다해 다시 다가가야 해요. 그리고 상대를 불러오기보다 내가 먼저 몸을 낮춰 찾아가는 겸손함이 사람의 마음을 열어요. 큰일은 좋은 사람을 얻는 데서 시작돼요.`,teaching:`유비는 제갈량보다 스무 살이나 많은 장군이었지만, 젊은 선비를 얻으려고 세 번이나 직접 찾아갔어요. 제갈량은 그 정성에 감동해 평생 유비와 그 아들을 도왔고, 출사표에 그 고마움을 적었어요. 윗사람이 몸을 낮출 때 진짜 인재가 모인다는 가르침이에요.`,think:`내가 꼭 함께하고 싶은 사람이나 꼭 배우고 싶은 분이 있나요? 그 마음을 어떻게 정성껏 전할 수 있을까요?`,caution:`상대가 분명히 싫다고 하는데도 계속 조르라는 뜻은 아니에요. 예의를 지키며 정성을 보이라는 뜻이에요.`},"sg-02":{hook:`물고기에게 물이 필요하듯 — 서로를 살리는 사이`,examples:[{where:`학교`,text:`한 친구는 그림을, 한 친구는 글을 맡아 늘 함께 멋진 신문을 만든다면 수어지교라 할 만해요.`},{where:`가정`,text:`서로의 부족한 점을 채워 주며 집안일을 함께 해내는 엄마와 아빠는 수어지교예요.`},{where:`사회`,text:`아이디어를 내는 사람과 그것을 만들어 내는 사람이 오래 손발을 맞춘 동업자를 수어지교라고 해요.`}],lesson:`좋은 관계는 서로를 살게 해 줘요. 물고기는 물이 있어야 살고, 물은 물고기가 있어 생명이 넘치지요. 나와 다른 재능을 가진 사람을 소중히 여기고, 서로의 빈 곳을 채워 주는 관계를 만들어 가요.`,teaching:`관우와 장비는 유비와 오래 함께한 형제 같은 장수였지만, 유비는 새로 온 제갈량을 감싸며 “물고기와 물”이라고 말했어요. 오래된 사람과 새로 온 사람이 서로 질투하지 않고 함께해야 큰일을 이룰 수 있다는 것, 그리고 지도자는 그 마음을 잘 다독여야 한다는 가르침이에요.`,think:`나에게 물과 같은 사람은 누구인가요? 나는 그 사람에게 어떤 도움이 되고 있나요?`},"sg-03":{hook:`사흘 만에 몰라보게 달라진 장군 — 배우는 사람은 매일 자란다`,examples:[{where:`학교`,text:`방학 동안 날마다 책을 읽은 친구의 글솜씨가 몰라보게 좋아졌다면 괄목상대예요.`},{where:`가정`,text:`줄넘기를 하나도 못 하던 동생이 한 달 연습해 백 번을 넘게 했다면 괄목상대한 거예요.`},{where:`사회`,text:`작은 회사가 꾸준히 기술을 익혀 몇 년 만에 크게 성장한 것을 괄목상대라고 해요.`}],lesson:`지금 잘 못한다고 앞으로도 못하는 것은 아니에요. 꾸준히 배우면 누구나 짧은 사이에 몰라보게 달라질 수 있어요. 그리고 다른 사람을 볼 때도 예전 모습만 기억하지 말고, 지금 얼마나 자랐는지 새 눈으로 봐 주어야 해요.`,teaching:`손권은 “바쁘다”는 여몽에게 “나도 바쁘지만 책을 읽는다”며 배움을 권했어요. 여몽은 그 말을 듣고 공부해 노숙이 놀랄 만큼 달라졌고, 뒷날 오나라의 큰 장수가 되었어요. 바쁘다는 핑계보다 배우려는 마음이 사람을 키운다는 가르침이에요.`,think:`“시간이 없어서” 미뤄 둔 배움이 있나요? 하루에 조금씩이라도 시작한다면 무엇부터 할까요?`},"sg-04":{hook:`일곱 번 놓아준 까닭 — 힘이 아니라 마음을 얻다`,examples:[{where:`학교`,text:`자꾸 다투던 친구를 혼내기보다 여러 번 이야기를 들어 주어 결국 사이가 좋아졌다면 칠종칠금이에요.`},{where:`가정`,text:`말을 듣지 않던 동생에게 억지로 시키지 않고 스스로 할 때까지 기회를 준 형은 칠종칠금을 보여 주었어요.`},{where:`사회`,text:`불만이 많던 손님의 이야기를 끝까지 듣고 문제를 고쳐 단골로 만든 가게를 칠종칠금에 빗대요.`}],lesson:`힘으로 이기면 상대는 다시 일어나 싸우려 해요. 하지만 마음으로 따르게 하면 다툼이 끝나요. 상대를 무조건 누르기보다 기회를 주고 존중하면, 결국 그 사람이 스스로 내 편이 되어 줘요. 진짜 이기는 것은 마음을 얻는 것이에요.`,teaching:`제갈량은 남쪽 땅을 힘으로만 누르면 군대가 떠난 뒤 다시 반란이 일어날 것을 알았어요. 그래서 맹획이 진심으로 따를 때까지 일곱 번이나 놓아주었고, 땅도 그곳 우두머리들에게 맡겼어요. 다스림은 마음을 얻는 데 있다는 가르침이에요.`,think:`나와 자꾸 부딪히는 사람이 있나요? 이기려 하기보다 그 사람의 마음을 얻으려면 어떻게 해야 할까요?`,caution:`나쁜 행동을 그냥 넘어가라는 뜻은 아니에요. 벌보다 이해와 기회로 마음을 바꾸게 하라는 뜻이에요.`},"mz-01":{hook:`싹을 뽑아 올린 농부 — 빨리 키우려다 모두 시들게 했다`,examples:[{where:`학교`,text:`시험 전날 밤을 새워 한꺼번에 외우려다 정작 시험 시간에 졸았다면 알묘조장이에요.`},{where:`가정`,text:`빨리 피라고 화분에 물을 잔뜩 주었다가 뿌리를 썩게 한 것도 알묘조장이에요.`},{where:`사회`,text:`빨리 성과를 내라고 직원들을 지나치게 몰아붙이다 모두 지쳐 그만두게 만든 것을 알묘조장이라고 해요.`}],lesson:`무엇이든 자라는 데는 시간이 필요해요. 서두른다고 빨리 자라지 않고, 억지로 당기면 오히려 뿌리가 상해요. 공부도 실력도 마음도 날마다 조금씩 물을 주고 기다려야 튼튼하게 자라요. 기다림도 노력의 한 부분이에요.`,teaching:`맹자는 이 이야기로 마음의 힘을 기르는 방법을 설명했어요. 아예 잊고 돌보지 않는 것도 안 되지만, 억지로 서둘러 키우려는 것은 더 해롭다고 했지요. 세상에는 싹을 돌보지 않는 사람도 많고, 뽑아 올리는 사람도 많다고 했어요. 꾸준히 돌보되 때를 기다리라는 가르침이에요.`,think:`빨리 잘하고 싶어서 서두르다 오히려 망친 일이 있나요? 그 일을 다시 한다면 어떻게 하고 싶나요?`},"mz-02":{hook:`하늘과 땅을 채우는 기운 — 옳은 일이 쌓여 생기는 당당함`,examples:[{where:`학교`,text:`잘못한 일을 숨기지 않고 먼저 사과한 뒤 마음이 떳떳해졌다면 호연지기를 기른 거예요.`},{where:`가정`,text:`주말마다 가족과 산에 올라 탁 트인 경치를 보며 큰 꿈을 이야기하는 것도 호연지기를 키우는 일이에요.`},{where:`사회`,text:`불의 앞에서도 굽히지 않고 바른말을 하는 사람을 보며 호연지기가 있다고 해요.`}],lesson:`진짜 큰 사람은 목소리가 큰 사람이 아니라 부끄러운 일이 없는 사람이에요. 작은 약속을 지키고 옳은 일을 하나씩 쌓아 가면, 누구 앞에서도 당당한 마음의 힘이 생겨요. 그 힘은 하루아침에 생기지 않고, 날마다의 바른 행동에서 자라나요.`,teaching:`맹자는 호연지기가 “의로움이 모여서 생기는 것”이라고 했어요. 한 번 착한 일을 했다고 생기는 것이 아니고, 마음에 부끄러운 일이 있으면 바로 시들어 버린다고 했지요. 바르게 살아가는 하루하루가 쌓여 큰 사람이 된다는 가르침이에요.`,think:`내가 떳떳하고 당당하다고 느꼈던 때는 언제였나요? 그런 마음을 키우려면 오늘 어떤 옳은 일을 할 수 있을까요?`},"mz-03":{hook:`나무 위에서 물고기를 찾는다? — 방법이 틀리면 노력도 헛수고`,examples:[{where:`학교`,text:`수학 점수를 올리고 싶다면서 문제는 안 풀고 공책 꾸미기만 하는 것은 연목구어예요.`},{where:`가정`,text:`동생과 친해지고 싶다면서 동생 물건을 자꾸 빼앗는 것은 연목구어예요.`},{where:`사회`,text:`손님을 늘리고 싶다면서 서비스는 그대로 두고 가격만 올린 가게를 연목구어라고 해요.`}],lesson:`열심히 하는 것만큼 중요한 것은 바른 방법을 고르는 거예요. 방향이 틀리면 아무리 애써도 목표에 닿지 못해요. 무언가를 이루고 싶을 때는 먼저 “이 방법이 정말 목표로 가는 길인가?”를 스스로 물어보아요.`,teaching:`맹자는 힘으로 이웃 나라를 굴복시키려는 제 선왕에게, 그 방법으로는 천하를 얻을 수 없고 오히려 재앙이 온다고 했어요. 대신 백성을 아끼는 어진 정치를 펴면 사람들이 스스로 모여든다고 했지요. 목표가 옳아도 방법이 틀리면 안 된다는 가르침이에요.`,think:`지금 이루고 싶은 목표와, 그걸 위해 하고 있는 방법을 떠올려 보세요. 그 방법이 정말 목표로 가는 길인가요?`},"mz-04":{hook:`하루 볕, 열흘 추위 — 하다 말다 하면 아무것도 자라지 않는다`,examples:[{where:`학교`,text:`한 번 큰마음 먹고 공부하고는 일주일 내내 놀기를 되풀이하는 것은 일폭십한이에요.`},{where:`가정`,text:`피아노를 하루 열심히 치고 열흘 동안 뚜껑도 안 열면 실력이 늘지 않아요. 일폭십한이지요.`},{where:`사회`,text:`계획만 거창하게 세우고 며칠 하다 그만두기를 되풀이하는 일을 일폭십한이라고 해요.`}],lesson:`하루에 아주 많이 하는 것보다 날마다 조금씩 하는 것이 더 큰 힘이 있어요. 그리고 같은 것을 배워도 마음을 다해 집중하느냐에 따라 결과가 달라져요. 꾸준함과 집중, 이 두 가지가 실력을 만드는 비밀이에요.`,teaching:`맹자는 왕이 지혜롭지 못한 것이 머리 탓이 아니라, 좋은 말을 들을 기회는 드물고 나쁜 말은 자주 듣기 때문이라고 했어요. 혁추의 두 제자도 머리가 아니라 마음을 쏟느냐의 차이였지요. 자주, 꾸준히, 마음을 다해야 자란다는 가르침이에요.`,think:`하다 말다 하는 일이 있나요? 날마다 조금씩 꾸준히 하려면 어떤 작은 약속을 정하면 좋을까요?`}};function Ti(e){return wi[e]}function Ei(e){let t=Ci(e.id);return t.length?O(`section`,{class:`card storyboard`,"data-testid":`storyboard`,"aria-label":`그림으로 보는 「${e.reading}」의 유래`},O(`p`,{class:`eyebrow`},`그림으로 보는 유래`),O(`ol`,{class:`panels`},...t.map((e,t)=>{let n=O(`div`,{class:`panel-img`});return n.innerHTML=e.svg,O(`li`,{class:`panel`},O(`span`,{class:`panel-no`,"aria-hidden":`true`},String(t+1)),n,O(`p`,{class:`panel-cap`},e.caption))}))):null}function Di(e,t={}){let n=Ti(e.id);return n?O(`section`,{class:`card lesson${t.compact?` compact`:``}`,"data-testid":`lesson`},O(`p`,{class:`eyebrow`},`기억 노트`),O(`h3`,{class:`lesson-title`},O(`span`,{class:`hanja-sm`},e.idiom),` `,e.reading),O(`p`,{class:`lesson-easy`},kn[e.id]??e.meaning),O(`p`,{class:`lesson-hook`,"data-testid":`lesson-hook`},O(`span`,{class:`tag`},`기억 고리`),` `,n.hook),O(`h4`,null,`오늘날 이런 때 써요`),O(`ul`,{class:`lesson-examples`,"data-testid":`lesson-examples`},...n.examples.map(e=>O(`li`,null,O(`b`,null,e.where),` `,e.text)),O(`li`,null,O(`b`,null,`예문`),` `,e.modern)),O(`h4`,null,`교훈`),O(`p`,{"data-testid":`lesson-lesson`},n.lesson),O(`h4`,null,`가르침`),O(`p`,{"data-testid":`lesson-teaching`},n.teaching),n.caution?O(`p`,{class:`lesson-caution`},O(`span`,{class:`tag`},`쓸 때 주의`),` `,n.caution):null,O(`p`,{class:`lesson-think`,"data-testid":`lesson-think`},O(`span`,{class:`tag`},`생각해 보기`),` `,n.think)):null}var Oi=n({ShareWeb:()=>ki}),ki,Ai=t((()=>{U(),ki=class extends dr{async canShare(){return
